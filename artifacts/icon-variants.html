<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font:13px -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.pane{padding:26px 24px;display:flex;flex-direction:column;gap:16px}.dark{background:#151a26;color:#e7ebf4}.light{background:#f4f6fb;color:#18213a;border-top:1px solid rgba(15,23,42,.1)}h3{margin:0;font-size:11px;letter-spacing:.09em;opacity:.6;text-transform:uppercase;font-weight:600}.cardIcon{border:.5px solid;border-radius:10px;width:48px;height:48px;display:inline-flex;justify-content:center;align-items:center}.dark .cardIcon{border-color:rgba(148,163,184,.24)}.light .cardIcon{border-color:rgba(15,23,42,.16)}.cardIcon img{object-fit:contain;width:36px;height:36px}.bt img{width:96px;height:96px}.cols{display:flex;gap:34px;align-items:flex-start}.col{display:flex;flex-direction:column;gap:9px;align-items:center}.nm{font-size:11px;opacity:.65;max-width:110px;text-align:center;line-height:1.5}.lbl{font-size:10.5px;opacity:.45}</style></head><body><div class="pane dark"><h3>Dark · 48px 与 96px</h3><div class="cols"><div class="col"><span class="cardIcon undefined"><img src="icon-variant-a.svg"></span><span class="cardIcon bt"><img src="icon-variant-a.svg"></span><span class="nm">A 渐变实心 + 光心</span></div><div class="col"><span class="cardIcon undefined"><img src="icon-variant-b.svg"></span><span class="cardIcon bt"><img src="icon-variant-b.svg"></span><span class="nm">B 描边 + 淡填充</span></div><div class="col"><span class="cardIcon undefined"><img src="icon-variant-c.svg"></span><span class="cardIcon bt"><img src="icon-variant-c.svg"></span><span class="nm">C 实心 + 白环 + 大光心</span></div></div></div><div class="pane light"><h3>Light · 同一组，不改</h3><div class="cols"><div class="col"><span class="cardIcon undefined"><img src="icon-variant-a.svg"></span><span class="cardIcon bt"><img src="icon-variant-a.svg"></span><span class="nm">A</span></div><div class="col"><span class="cardIcon undefined"><img src="icon-variant-b.svg"></span><span class="cardIcon bt"><img src="icon-variant-b.svg"></span><span class="nm">B</span></div><div class="col"><span class="cardIcon undefined"><img src="icon-variant-c.svg"></span><span class="cardIcon bt"><img src="icon-variant-c.svg"></span><span class="nm">C</span></div></div></div><div class="pane light"><h3>列表行实际观感（40px 框 / 28px 图）</h3><div class="cols"><div class="col"><span class="cardIcon" style="width:40px;height:40px;border-radius:8px"><img src="icon-variant-a.svg" style="width:28px;height:28px"></span><span class="lbl">A</span></div><div class="col"><span class="cardIcon" style="width:40px;height:40px;border-radius:8px"><img src="icon-variant-b.svg" style="width:28px;height:28px"></span><span class="lbl">B</span></div><div class="col"><span class="cardIcon" style="width:40px;height:40px;border-radius:8px"><img src="icon-variant-c.svg" style="width:28px;height:28px"></span><span class="lbl">C</span></div></div></div></body></html>
