<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>团队协作中心 · 升级预览（dsh-auto-memory）</title>
<style>
/* ═══════════ 设计令牌：双主题（对应插件 Dark / Light 皮肤） ═══════════ */
:root{
  --r-lg:14px; --r-md:10px; --r-sm:8px;
  --font:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,"PingFang SC",sans-serif;
  --mono:ui-monospace,Consolas,"Cascadia Code",monospace;
  --primary:#4d6bfe; --primary-soft:rgba(77,107,254,.14);
  --ok:#34d399; --ok-soft:rgba(52,211,153,.13);
  --warn:#fbbf24; --warn-soft:rgba(251,191,36,.13);
  --bad:#f87171; --bad-soft:rgba(248,113,113,.13);
  --cyan:#38bdf8; --cyan-soft:rgba(56,189,248,.13);
  --vio:#a78bfa; --vio-soft:rgba(167,139,250,.14);
  --sp:.18s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#12151f; --bg2:#171b28; --panel:#1c2130; --panel2:#222839; --raise:#272e42;
  --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.24);
  --tx:#e7ebf4; --tx2:#9aa4ba; --tx3:#67718a;
  --shadow:0 8px 28px rgba(0,0,0,.35); --shadow-sm:0 2px 10px rgba(0,0,0,.25);
  --glass:rgba(28,33,48,.86);
}
[data-theme="light"]{
  --bg:#eef1f7; --bg2:#f4f6fb; --panel:#ffffff; --panel2:#f6f8fc; --raise:#eef1f8;
  --line:rgba(15,23,42,.09); --line2:rgba(15,23,42,.16);
  --tx:#18213a; --tx2:#5a6579; --tx3:#8b94a7;
  --shadow:0 10px 30px rgba(23,32,64,.10); --shadow-sm:0 2px 8px rgba(23,32,64,.06);
  --glass:rgba(255,255,255,.88);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.6 var(--font);background:var(--bg);color:var(--tx);transition:background .3s,color .3s}
::selection{background:var(--primary-soft)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:var(--tx)}
a{color:var(--primary);text-decoration:none}

/* ═══════════ 全局骨架 ═══════════ */
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--glass);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#4d6bfe,#8b5cf6);
  display:grid;place-items:center;color:#fff;font-size:13px}
.brand small{color:var(--tx3);font-weight:500;font-size:11px;margin-left:2px}
.teamchip{display:flex;align-items:center;gap:7px;padding:4px 11px 4px 6px;border:1px solid var(--line);
  border-radius:999px;background:var(--panel);font-size:12px;color:var(--tx2);cursor:pointer;transition:var(--sp)}
.teamchip:hover{border-color:var(--line2);color:var(--tx)}
.teamchip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.topbar .grow{flex:1}
.avstack{display:flex;align-items:center}
.avstack .av{margin-left:-7px;border:2px solid var(--panel)}
.avstack .more{margin-left:6px;font-size:11px;color:var(--tx3)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--r-sm);
  border:1px solid var(--line2);background:var(--panel);color:var(--tx);font-size:12.5px;transition:var(--sp);white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
.btn.danger{color:var(--bad);border-color:rgba(248,113,113,.4)}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--tx2)}
.btn.ghost:hover{background:var(--panel2);color:var(--tx)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;pointer-events:none}
.iconbtn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--tx2);
  border:1px solid transparent;transition:var(--sp);font-size:15px}
.iconbtn:hover{background:var(--panel2);color:var(--tx)}

.main{display:grid;grid-template-columns:196px 1fr;min-height:0}
.sidenav{background:var(--bg2);border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto}
.navgroup{font-size:10.5px;color:var(--tx3);letter-spacing:.08em;padding:8px 10px 4px;text-transform:uppercase}
.navitem{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-sm);
  color:var(--tx2);font-size:13px;margin-bottom:2px;transition:var(--sp);text-align:left;position:relative}
.navitem .ic{width:17px;text-align:center;font-size:14px}
.navitem:hover{background:var(--panel2);color:var(--tx)}
.navitem.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.navitem.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.navitem .cnt{margin-left:auto;font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--bad-soft);color:var(--bad);font-weight:600}
.navitem .cnt.zero{background:var(--panel2);color:var(--tx3)}

.content{overflow-y:auto;padding:22px 26px 60px;min-width:0}
.page{max-width:1020px;margin:0 auto;animation:pin .28s cubic-bezier(.3,0,.2,1)}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pagehead{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.pagehead h1{font-size:19px;font-weight:700}
.pagehead .sub{color:var(--tx3);font-size:12px}
.pagehead .grow{flex:1}

/* ═══════════ 通用元件 ═══════════ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card.pad{padding:16px 18px}
.card h3{font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h3 .ic{color:var(--tx3)}
.grid{display:grid;gap:14px}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.grid.g2{grid-template-columns:1fr 1fr}
.grid.g32{grid-template-columns:3fr 2fr}
@media(max-width:960px){.grid.g4{grid-template-columns:1fr 1fr}.grid.g32,.grid.g2{grid-template-columns:1fr}}
.stat{padding:15px 17px;position:relative;overflow:hidden;transition:var(--sp)}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat .lbl{font-size:11.5px;color:var(--tx3);display:flex;gap:6px;align-items:center}
.stat .val{font-size:26px;font-weight:750;margin-top:5px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .trend{font-size:11px;color:var(--tx3);margin-top:2px}
.stat.accent-warn .val{color:var(--warn)} .stat.accent-bad .val{color:var(--bad)}
.stat.accent-ok .val{color:var(--ok)} .stat.accent-vio .val{color:var(--vio)}
.stat .halo{position:absolute;right:-22px;top:-22px;width:86px;height:86px;border-radius:50%;opacity:.10}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600}
.pill .d{width:6px;height:6px;border-radius:50%}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.ok .d{background:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.warn .d{background:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.bad .d{background:var(--bad)}
.pill.cyan{background:var(--cyan-soft);color:var(--cyan)} .pill.cyan .d{background:var(--cyan)}
.pill.vio{background:var(--vio-soft);color:var(--vio)} .pill.vio .d{background:var(--vio)}
.pill.mute{background:var(--panel2);color:var(--tx3)} .pill.mute .d{background:var(--tx3)}
.kbd{font:11px var(--mono);background:var(--panel2);border:1px solid var(--line2);border-bottom-width:2px;
  border-radius:5px;padding:0 5px;color:var(--tx2)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11.5px;
  font-weight:700;background:var(--hsl);flex-shrink:0;position:relative}
.av.lg{width:34px;height:34px;font-size:14px}
.av .pd{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--panel)}
.av .pd.on{background:var(--ok)} .av .pd.sync{background:var(--warn)} .av .pd.off{background:var(--tx3)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 10px;color:var(--tx3);text-align:center}
.empty .art{width:52px;height:52px;border-radius:16px;background:var(--panel2);display:grid;place-items:center;font-size:23px}
.empty b{color:var(--tx2);font-size:13px}
.toastwrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{display:flex;align-items:center;gap:9px;background:var(--raise);border:1px solid var(--line2);
  border-radius:var(--r-md);padding:9px 16px;font-size:12.5px;box-shadow:var(--shadow);animation:tin .25s cubic-bezier(.3,1.3,.5,1)}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
.spark{display:flex;align-items:flex-end;gap:2px;height:30px}
.spark i{flex:1;background:var(--primary);border-radius:2px 2px 0 0;opacity:.75;min-width:3px;transition:height .4s}
.spark i.bad{background:var(--bad)}
.sect{margin-top:22px}
.hint{font-size:11.5px;color:var(--tx3);line-height:1.55}
.divv{height:1px;background:var(--line);margin:14px 0}

/* ═══════════ 概览 ═══════════ */
.pulse{display:flex;align-items:center;gap:16px;padding:16px 18px}
.pulse .ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;position:relative;flex-shrink:0}
.pulse .ring::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--ok-soft);animation:br 2.6s ease-out infinite}
@keyframes br{0%{transform:scale(.82);opacity:1}100%{transform:scale(1.25);opacity:0}}
.pulse .ring .in{width:30px;height:30px;border-radius:50%;background:var(--ok-soft);display:grid;place-items:center;color:var(--ok);font-size:14px}
.pulse .t b{font-size:14px}
.pulse .t .meta{font-size:11.5px;color:var(--tx3);display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}
.feed{display:flex;flex-direction:column}
.frow{display:flex;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:flex-start;transition:var(--sp)}
.frow:last-child{border-bottom:none}
.frow:hover{background:var(--panel2);border-radius:var(--r-sm)}
.frow .opic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;flex-shrink:0;margin-top:2px}
.op-create{background:var(--ok-soft);color:var(--ok)} .op-edit{background:var(--cyan-soft);color:var(--cyan)}
.op-merge{background:var(--vio-soft);color:var(--vio)} .op-delete{background:var(--bad-soft);color:var(--bad)}
.op-resolve{background:var(--warn-soft);color:var(--warn)}
.frow .ft{min-width:0;flex:1}
.frow .ft .l1{font-size:12.5px}
.frow .ft .l1 b{font-weight:650}
.frow .ft .key{font:11.5px var(--mono);color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow time{font-size:11px;color:var(--tx3);flex-shrink:0;margin-top:3px}
.opchip{font-size:10px;padding:1px 7px;border-radius:5px;font-weight:700;letter-spacing:.04em}
.todo-row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line)}
.todo-row:last-child{border-bottom:none}
.todo-row .t{flex:1;min-width:0}
.todo-row .t b{font-size:12.5px;display:block}
.todo-row .t span{font-size:11px;color:var(--tx3)}

/* ═══════════ 成员 ═══════════ */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mcard{padding:17px;text-align:center;position:relative;transition:var(--sp)}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.mcard.self{border-color:rgba(77,107,254,.5);box-shadow:0 0 0 1px rgba(77,107,254,.25),var(--shadow-sm)}
.mcard .av{margin:0 auto 10px}
.mcard .nm{font-weight:650;font-size:13.5px}
.mcard .id{font:10.5px var(--mono);color:var(--tx3);margin:1px 0 8px}
.mcard .caps{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:10px}
.mcard .sum{font-size:11px;color:var(--tx3);margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
.mcard .you{position:absolute;top:10px;right:10px}
.invite{border:1.5px dashed var(--line2);border-radius:var(--r-lg);display:grid;place-items:center;
  color:var(--tx3);cursor:pointer;transition:var(--sp);min-height:150px;gap:6px;padding:14px}
.invite:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.capsel{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--tx2)}

/* ═══════════ 活动 ═══════════ */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.fchip{font-size:11.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line2);color:var(--tx2);transition:var(--sp)}
.fchip:hover{border-color:var(--primary);color:var(--primary)}
.fchip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}

/* ═══════════ 冲突评审台 ═══════════ */
.rev{display:grid;grid-template-columns:288px 1fr;gap:14px;min-height:420px}
@media(max-width:900px){.rev{grid-template-columns:1fr}}
.qlist{display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:560px}
.qitem{text-align:left;padding:12px 13px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--panel);
  transition:var(--sp);position:relative;width:100%}
.qitem:hover{border-color:var(--line2)}
.qitem.on{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px rgba(77,107,254,.3)}
.qitem.gone{opacity:0;transform:translateX(26px);position:absolute;pointer-events:none}
.qitem .qk{font-size:12.5px;font-weight:650;display:flex;gap:7px;align-items:center}
.qitem .qm{font-size:11px;color:var(--tx3);margin-top:4px;display:flex;gap:8px;align-items:center}
.diffhead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.diffcols{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);flex:1;min-height:0}
@media(max-width:760px){.diffcols{grid-template-columns:1fr}}
.diffcol{background:var(--bg2);padding:12px 14px;overflow:auto;max-height:300px}
.diffcol h5{font-size:11px;letter-spacing:.06em;color:var(--tx3);margin-bottom:8px;display:flex;gap:7px;align-items:center}
.dline{font:11.5px/1.75 var(--mono);padding:0 8px;border-radius:4px;white-space:pre-wrap;word-break:break-all}
.dline.add{background:var(--ok-soft);color:var(--ok)}
.dline.del{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;text-decoration-color:rgba(248,113,113,.5)}
.dline.base{color:var(--tx3)}
.dline.ctx{color:var(--tx2)}
.verdict{display:flex;gap:9px;padding:13px 16px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.vbtn{flex:1;min-width:110px;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--line2);
  background:var(--panel);font-size:12.5px;font-weight:600;transition:var(--sp);display:flex;justify-content:center;gap:7px;align-items:center}
.vbtn:hover{transform:translateY(-1px)}
.vbtn.local:hover{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.vbtn.remote:hover{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-soft)}
.vbtn.merge:hover{border-color:var(--vio);color:var(--vio);background:var(--vio-soft)}
.vbtn.dlgt:hover{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.vbtn.armed{animation:shake .35s;border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.rejrow{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);font-size:12px}
.rejrow:last-child{border-bottom:none}

/* ═══════════ 审批 ═══════════ */
.skcard{padding:16px 18px;transition:var(--sp)}
.skcard:hover{box-shadow:var(--shadow)}
.skhead{display:flex;align-items:flex-start;gap:11px}
.skhead .si{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex-shrink:0;background:var(--vio-soft);color:var(--vio)}
.skhead .t{flex:1;min-width:0}
.skhead .t b{font-size:13.5px}
.skhead .t .meta{font-size:11px;color:var(--tx3);margin-top:2px}
.evbar{display:flex;gap:14px;margin:13px 0 4px}
.ev{flex:1}
.ev .n{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.ev .l{font-size:10.5px;color:var(--tx3)}
.ev .bar{height:4px;border-radius:2px;background:var(--panel2);margin-top:5px;overflow:hidden}
.ev .bar i{display:block;height:100%;border-radius:2px;background:var(--ok);transition:width .6s cubic-bezier(.3,0,.2,1)}
.steps{margin-top:10px;border-left:2px solid var(--line2);padding-left:13px;display:flex;flex-direction:column;gap:5px}
.steps .st{font-size:11.5px;color:var(--tx2);display:flex;gap:8px}
.steps .st i{font:10px var(--mono);color:var(--tx3);font-style:normal;margin-top:2px}

/* ═══════════ 交接 ═══════════ */
.chain{display:flex;flex-direction:column;gap:0}
.cnode{display:flex;gap:14px;position:relative;padding-bottom:22px}
.cnode::before{content:"";position:absolute;left:17px;top:36px;bottom:0;width:2px;background:var(--line2)}
.cnode:last-child::before{display:none}
.cnode .av{z-index:1}
.cnode .cb{flex:1;padding:12px 15px}
.cnode .cb .l1{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.cnode .cb .l1 b{font-size:13px}
.cnode .cb .meta{font-size:11px;color:var(--tx3);margin-top:3px}

/* ═══════════ 同步 ═══════════ */
.transport{display:flex;gap:12px;flex-wrap:wrap}
.tcard{flex:1;min-width:200px;padding:14px 16px;border:1px solid var(--line2);border-radius:var(--r-md);transition:var(--sp);cursor:pointer;position:relative}
.tcard:hover{border-color:var(--primary)}
.tcard.on{border-color:var(--primary);background:var(--primary-soft)}
.tcard b{font-size:13px;display:flex;gap:8px;align-items:center}
.tcard .d{font-size:11px;color:var(--tx3);margin-top:5px;line-height:1.55}
.tcard .tick{position:absolute;top:10px;right:10px;color:var(--primary);font-weight:700}
table.tb{width:100%;border-collapse:collapse;font-size:12px}
.tb th{font-size:10.5px;text-align:left;color:var(--tx3);letter-spacing:.06em;padding:7px 10px;border-bottom:1px solid var(--line);font-weight:600}
.tb td{padding:8px 10px;border-bottom:1px solid var(--line)}
.tb tr:hover td{background:var(--panel2)}
.tb .mono{font:11.5px var(--mono);color:var(--tx2)}
.lagmeter{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;display:flex;margin-top:7px}
.lagmeter i{display:block;height:100%}
.danger-zone{border-color:rgba(248,113,113,.35)}
.danger-zone h3{color:var(--bad)}

/* ═══════════ 设置 ═══════════ */
.setcard{margin-bottom:16px}
.setrow{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .info{flex:1;min-width:0}
.setrow .info b{font-size:12.5px;display:block}
.setrow .info .d{font-size:11px;color:var(--tx3);margin-top:2px;line-height:1.5}
.switch{position:relative;width:38px;height:22px;flex-shrink:0;cursor:pointer}
.switch input{opacity:0;width:100%;height:100%;position:absolute;cursor:pointer;margin:0}
.switch .tr{position:absolute;inset:0;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);transition:var(--sp)}
.switch .tr::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;
  box-shadow:0 1px 4px rgba(0,0,0,.3);transition:var(--sp)}
.switch input:checked+.tr{background:var(--primary);border-color:var(--primary)}
.switch input:checked+.tr::after{left:18px}
.tin{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r-sm);padding:7px 11px;font-size:12.5px;min-width:210px;outline:none;transition:var(--sp)}
.tin:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.compliance{background:var(--warn-soft);border:1px solid rgba(251,191,36,.35);border-radius:var(--r-md);padding:12px 15px;
  display:flex;gap:11px;font-size:12px;color:var(--tx2);line-height:1.6}
.polcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px;margin-top:10px}
.polcard{padding:11px 13px;border:1px solid var(--line2);border-radius:var(--r-md);cursor:pointer;transition:var(--sp)}
.polcard:hover{border-color:var(--primary)}
.polcard.on{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px rgba(77,107,254,.3)}
.polcard b{font-size:12.5px;display:flex;gap:7px;align-items:center}
.polcard .d{font-size:10.5px;color:var(--tx3);margin-top:4px;line-height:1.5}
.capline{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
input[type=range]{accent-color:var(--primary)}
.footer-note{margin-top:34px;padding:13px 16px;border:1px dashed var(--line2);border-radius:var(--r-md);
  font-size:11px;color:var(--tx3);line-height:1.7}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

</div>

<script>

],localSeq:128,serverSeq:124,rejected:{total:6,recent:[

  {at:'昨天',reason:'schema-mismatch',detail:'procedure v2 payload'},
]}};
const SPARK=[3,5,4,0,2,6,8,4,2,0,1,3,7,9,5,3,1,2,4,6,3,0,1,2];

/* ═══════════════ 基础工具 ═══════════════ */
function hue(id){let a=0;const s=String(id);for(let i=0;i<s.length;i++)a=(a*31+s.charCodeAt(i))%360;return a}
function av(m,cls){const h=hue(m.id);return `<span class="av ${cls||''}" style="--hsl:hsl(${h},62%,52%)" title="${m.name} · ${ROLEZH[m.role]}">${m.name[0]}</span>`}
function avById(id,cls){const m=MEMBERS.find(x=>x.id===id)||{id:id,name:String(id)[0],role:'viewer'};return av(m,cls)}
function ago(m){if(m<60)return m+' 分钟前';if(m<1440)return Math.floor(m/60)+' 小时前';return Math.floor(m/1440)+' 天前'}
function toast(msg,ic){const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span style="color:var(--ok)">${ic||'✓'}</span>${msg}`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},2600)}
function toggleTheme(){const b=document.documentElement;b.dataset.theme=b.dataset.theme==='dark'?'light':'dark';
  document.getElementById('themeBtn').textContent=b.dataset.theme==='dark'?'◐':'◑'}
function syncNow(btn){const ic=document.getElementById('syncIc'),tx=document.getElementById('syncTx');
  ic.style.display='inline-block';ic.style.animation='spin .8s linear infinite';
  tx.textContent='同步中…';btn.disabled=true;
  setTimeout(()=>{ic.style.animation='';tx.textContent='立即同步';btn.disabled=false;
    toast('已同步 · 2 条变更上行 · 游标 128 → 128','⟳')},900)}
const st=document.createElement('style');st.textContent='@keyframes spin{to{transform:rotate(360deg)}}';document.head.appendChild(st);

/* 顶栏头像堆叠 */
document.getElementById('topAvs').innerHTML=MEMBERS.map(m=>{
  const pd=m.state==='sync'?'sync':m.state==='on'?'on':'off';
  return av(m).replace('class="av','class="av').replace('</span>',`<span class="pd ${pd}"></span></span>`)}).join('');

/* ═══════════════ 页面渲染 ═══════════════ */

</div>`};

let curC=null,armed=null;
P.conflicts=()=>{
  const c=CONFLICTS.find(x=>x.id===curC)||CONFLICTS[0];
  const lines=(txt,other)=>{
    const a=txt.split('\n'),b=other.split('\n');const out=[];
    a.forEach(l=>{ if(!b.includes(l)) out.push({t:l,c:'del'}); else out.push({t:l,c:'ctx'}) });
    b.forEach(l=>{ if(!a.includes(l)) out.push({t:l,c:'add',side:1}) });

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function resolve(id,choice){const c=CONFLICTS.find(x=>x.id===id);if(!c)return;

P.sync=()=>{const pend=SYNC.queue.filter(q=>q.state==='pending').length,

  </div>

  <div class="grid g2 sect">

    </div>
  </div>
</div>`};

    <div class="setrow"><div class="info"><b>心跳间隔 · 5 秒</b><div class="d">失败自动指数退避（2ⁿ 封顶 30s），成功重置</div></div>
      <input type="range" min="2" max="60" value="5" style="width:150px" oninput="this.closest('.setrow').querySelector('.info b').textContent='心跳间隔 · '+this.value+' 秒'"></div>
    <div class="setrow"><div class="info"><b>下行注入到模型上下文</b><div class="d">团队段 priority=low 参与同一本预算账 —— 宁可裁团队信息，不挤掉你的个人规则</div></div>
      <label class="switch"><input type="checkbox" checked onchange="toast('团队注入已'+(this.checked?'开启':'关闭'),'◉')"><span class="tr"></span></label></div>
  </div>

  <div class="card pad setcard">
    <h3><span class="ic">⇄</span>冲突默认策略</h3>
    <p class="hint" style="margin-top:4px">条目级三方合并判定为 conflict 时（两边都改且不同）的兜底动作 · 可随时在裁决台逐条人工覆盖</p>
    <div class="polcards">
      <div class="polcard" onclick="pol(this)"><b>⚖ 每次询问（推荐）</b><div class="d">冲突进裁决台红点提醒，绝不静默选边</div></div>
      <div class="polcard on" onclick="pol(this)"><b>◉ 保留本机</b><div class="d">本机值优先，团队值进冲突账本备查</div></div>
      <div class="polcard" onclick="pol(this)"><b>⇩ 采用团队</b><div class="d">团队值优先，本机改动记入活动流</div></div>
      <div class="polcard" onclick="pol(this)"><b>⧉ 都保留</b><div class="d">keep-both：两条并存，事后手动整理</div></div>
    </div>
  </div>

  <div class="card pad setcard">
    <h3><span class="ic">🛡</span>合规与隐私（只读明示 · 严禁静默降级）</h3>
    <div class="compliance" style="margin-top:11px"><span style="font-size:16px">⚠</span>
      <div><b style="color:var(--warn)">当前档位：明文上行（按设计）</b><br>
      端到端加密本版本 <b>unsupported</b> —— 如实标注"做不到"，绝不显示"已加密"假象。数据只进你配置的私有桶；用量上报 = 关；除存储桶外<b style="color:var(--tx2)">零出网</b>（team-compliance 可随时审计）。</div></div>
    <div class="setrow"><div class="info"><b>成员徽标与「谁改动」</b><div class="d">记忆卡与列表显示作者徽标 · 归属旁挂索引不碰 Markdown 正文（磁盘仍是人类可读的）</div></div>
      <label class="switch"><input type="checkbox" checked onchange="toast('成员徽标已'+(this.checked?'开启':'关闭'),'◉')"><span class="tr"></span></label></div>
    <div class="setrow"><div class="info"><b>审计行</b><div class="d">条目详情显示完整操作史（create/edit/merge/delete/resolve）</div></div>
      <label class="switch"><input type="checkbox" onchange="toast('审计行已'+(this.checked?'开启':'关闭'),'◉')"><span class="tr"></span></label></div>
  </div>

  <div class="card pad setcard danger-zone">
    <h3><span class="ic">⚠</span>危险区</h3>
    <div class="setrow"><div class="info"><b>退出团队</b><div class="d">清空本机团队身份与游标；本地记忆、白板、技能原样保留 —— 团队数据只是"多了一层"，退出即回到单人版</div></div>
      <button class="btn danger sm" onclick="toast('（预览）实际执行前会要求输入团队 ID 确认','⚠')">退出团队</button></div>
  </div>

  <div class="footer-note">
    <b>预览说明</b> · 本页为团队协作前端的升级提案稿，全部数据为演示用假数据，但<b>每个视图的数据形状 = 现有后端路由的真实返回</b>。
    今日即可接线：概览 / 成员 / 活动流 / 同步 / 设置（9 条路由全在）。唯一后端缺口 = 冲突裁决与技能审批的 <span style="font:11px var(--mono)">POST resolve / approve</span> 两条动作路由（后端逻辑 resolve()/approve 语义已就绪，只差路由壳）。
    在场点采用"账本推断"诚实口径：不做假在线，服务端协议（T2）落地后自动升级为真·实时在场。
  </div>
</div>`;
function pol(el){el.parentElement.querySelectorAll('.polcard').forEach(x=>x.classList.remove('on'));el.classList.add('on');
  toast('冲突默认策略 → '+el.querySelector('b').textContent.slice(2),'⇄')}

/* ═══════════════ 导航与渲染 ═══════════════ */
function go(p){document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('on',b.dataset.p===p));render(p)}
function render(p){p=p||document.querySelector('.navitem.on').dataset.p;
  document.getElementById('content').innerHTML=P[p]?P[p]():'';
  const cc=document.getElementById('navConfCnt'),sc=document.getElementById('navSkCnt');
  if(cc){cc.textContent=CONFLICTS.length;cc.classList.toggle('zero',!CONFLICTS.length)}
  if(sc){sc.textContent=SKILLS.length;sc.classList.toggle('zero',!SKILLS.length)}
  content.scrollTop=0}
/* 键盘快捷裁决（冲突页 1/2/3/4） */
document.addEventListener('keydown',e=>{
  if(document.querySelector('.navitem.on').dataset.p!=='conflicts')return;
  const c=CONFLICTS.find(x=>x.id===curC)||CONFLICTS[0];if(!c)return;
  if(e.key==='1')resolve(c.id,'local');
  if(e.key==='2')resolve(c.id,'remote');
  if(e.key==='3')armMerge(c.id);
  if(e.key==='4')delegate(c.id)});
render('home');
</script>
</body>
</html>
