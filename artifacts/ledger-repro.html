<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
:root { --dam-scale: 1; }
body { font-family: system-ui; background:#111; color:#e8eaed; margin:0; padding:16px; }
/* mimic the memory panel body width 440px */
.wrap { width: 440px; box-sizing: border-box; }
/* exact rules from lib/client.js */
[data-dam-btn] { border: none; background: transparent; cursor: pointer; color: inherit; opacity: .75; font-size: calc(13px * var(--dam-scale)); padding: 4px 8px; border-radius: 6px; }
[data-dam-card] { border: 1px solid color-mix(in srgb, var(--dsw-alias-border-l1, rgba(128,128,128,.22)) 60%, transparent); border-radius: 9px; padding: 8px 10px; margin-bottom: 8px; font-size: calc(12.5px * var(--dam-scale)); background: color-mix(in srgb, var(--dsw-alias-bg-layer-1, rgba(128,128,128,.06)) 40%, transparent); }
[data-dam-card] .dam-date { font-weight: 600; margin-bottom: 4px; }
[data-dam-card] .dam-content { white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
[data-dam-row] { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
</style></head>
<body>
<div class="wrap">
  <div data-dam-card="">
    <div class="dam-date">Handoff ledger timeline</div>
    <div class="dam-content">
      <div data-dam-row="">
        <button data-dam-btn="">handoff-20260908-165632.md</button>
        <button data-dam-btn="">handoff-20260908-164407.md</button>
        <button data-dam-btn="">handoff-20260908-162308.md</button>
        <button data-dam-btn="">handoff-20260908-150242.md</button>
      </div>
    </div>
  </div>
</div>
</body></html>
