            - strong [ref=e1201]: Storage
            - text: ","
            - strong [ref=e1202]: Notes
            - text: ","
            - strong [ref=e1203]: Whiteboard
            - text: ","
            - strong [ref=e1204]: Reflections
            - text: ","
            - strong [ref=e1205]: Connect
            - text: (external memory),
            - strong [ref=e1206]: Calendar
            - text: ","
            - strong [ref=e1207]: Search
            - text: ","
            - strong [ref=e1208]: Workspace
            - text: "(mind map). The panel is considerate too: in DSH Desktop enhanced mode (transparent/Mica materials) it keeps its readability; the default position never covers the sidebar \"Memory\" entry; click outside or press Esc and it's gone — present, but never in the way."
          - paragraph [ref=e1209]:
