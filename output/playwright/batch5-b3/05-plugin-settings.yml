          - separator [ref=e606]
          - heading "Four things we poured our heart into" [level=2] [ref=e607]
          - paragraph [ref=e608]: Four features in this plugin were raised one by one, by hand; everything else — calendar, search, the mind map, unattended mode, memory hygiene — grows around them.
          - heading "The first · She takes notes, and she says welcome back" [level=3] [ref=e609]
          - paragraph [ref=e610]: "The earliest version of this plugin learned two small things: after every conversation, it wrote down what was worth keeping, unprompted; and when you returned from time away, or in the morning, afternoon, and late-night hours, it greeted you in a fitting tone. Simple — but these two acts set her character: memory is not a database, a greeting is not a notification chime; it is what a colleague who remembers you says when you walk back in. Everything else grew on that character. We call this plugin \"she\" throughout — not marketing polish, but because from the very first feature, she was doing the things a person does."
          - heading "The second · Not \"look it up when I remember\", but remembering while doing" [level=3] [ref=e611]
          - paragraph [ref=e612]:
            - text: "Humans use memory two ways: deliberately retracing what was done before — and, far more often, having the right memory surface on its own in the middle of doing. The last major release gave her the second kind. We put a Transformers model next to the memory stores so that, mid-conversation, she judges two things: whether anything is worth recalling right now, and which memory it should be — judging from the very material of the dialogue: what you're thinking, what you said, what she answered. The relevant memory thus walks into place, through a fixed boundary into the next turn, before the model even opens its mouth. It never depends on the model \"remembering to look\" — forget once, and the memory might as well not exist."
            - strong [ref=e613]: She remembers to think for you.
          - heading "The third · Like riding a bicycle — no need to think about how" [level=3] [ref=e614]
          - paragraph [ref=e615]: "Once a person learns to ride, they never replay the tutorial — muscle memory takes over, and the skill transfers to the next road on its own. She grows that kind of memory too: after watching your corrections a few times, or doing the same kind of thing again and again, a workflow crystallizes into a skill; next time something similar shows up, the checklist attaches itself — no one reminding. What was learned deliberately becomes something done casually — her procedural memory, the part you can review, pin, and watch grow in the Memory Hub tab."
          - heading "The fourth · Handoff, not compression" [level=3] [ref=e616]
          - paragraph [ref=e617]: When the context fills, she no longer burns the whole book for a one-line summary; she writes a four-part handoff note — state, goals, dead ends and why, progress and next step — closes this window, and opens the next. The full history stays archived and searchable; details can always be looked back up. The newest of the four, and the last piece of a complete memory — see How she hands off.
          - separator [ref=e618]
          - heading "Why a plugin" [level=2] [ref=e619]
          - paragraph [ref=e620]: "In September 2026, GPT-6 Astra shipped Context Management as an experimental flagship feature: notes kept across context windows, earlier history searchable, handoff preferred over compression as the window fills."
          - paragraph [ref=e621]: "Seeing the announcement, we were quietly glad — like someone walking a night road alone who sees a light come on in the distance. Putting memory outside the window: structured notes, searchable archives, handoff over compression — it turns out we are not the only traveler on this road. That a flagship is willing to press the experimental button for it says this idea deserves to be taken seriously by more people."
          - paragraph [ref=e622]: "So we built it as an open plugin: no experimental gate, no subscription tier — install it in DSH, and every model on your machine gets its own."
