          - paragraph [ref=e1145]:
            - strong [ref=e1146]: Two hard engineering constraints
            - text: ":"
          - list [ref=e1147]:
            - listitem [ref=e1148]:
              - strong [ref=e1149]: Ledger quality is a hard gate, not a style suggestion.
              - text: The four headings must match
              - strong [ref=e1150]: verbatim
              - text: (a wrong heading breaks downstream weighted truncation and the injection-side parser), each section has a minimum length, and a bad one is rejected outright — the very shape of the section you're reading was formed by that gate.
            - listitem [ref=e1151]:
              - strong [ref=e1152]: Anchors stop append-writes from piercing the file.
              - code [ref=e1153]: appendAnchoredRecord()
              - text: "parses the existing file first: any non-clean state"
              - strong [ref=e1154]: fails closed
              - text: (neither appends nor rewrites); if reserved syntax appears in the body, the write is
              - strong [ref=e1155]: refused on the spot with a line number
              - text: — rather than "succeeding" and then making the whole file permanently unwritable from the next write onward.
          - paragraph [ref=e1156]:
            - strong [ref=e1157]: The kanban board is not a separate UI
            - text: — it is
            - strong [ref=e1158]: another view over the same ledgers and whiteboard
