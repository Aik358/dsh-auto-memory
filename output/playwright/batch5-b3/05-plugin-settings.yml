              - row [ref=e1395]:
                - cell [ref=e1396]:
                  - strong [ref=e1397]: Write-side gate
                - cell [ref=e1398]:
                  - text: Reserved-syntax filtering moved
                  - emphasis [ref=e1399]: into the write primitives
                  - text: instead of being detected after the fact. Content carrying a reserved marker is refused on the spot
                  - strong [ref=e1400]: with a line number
                  - text: — no more "one bad line makes the whole file permanently unwritable"
              - row [ref=e1401]:
                - cell [ref=e1402]:
                  - strong [ref=e1403]: Decision ledger
                - cell [ref=e1404]:
                  - text: Every "should I recall this?" call becomes a reviewable ledger entry; five-grade scoring (A/P/S/H/E) flows back into policy. Not a log — an
                  - strong [ref=e1405]: auditable chain of decisions
              - row [ref=e1406]:
                - cell [ref=e1407]:
                  - strong [ref=e1408]: Single-source state commit
                - cell "The memory index version (miv) converges on one source, killing the \"one store, two version numbers\" class of recompute-and-miss bugs" [ref=e1409]
              - row [ref=e1410]:
                - cell [ref=e1411]:
                  - strong [ref=e1412]: Concurrent atomic writes
                - cell [ref=e1413]:
                  - text: On Windows a
                  - code [ref=e1414]: rename
                  - text: hitting an external file handle throws
                  - code [ref=e1415]: EPERM
                  - text: . Now it retries with backoff, and on final failure it
                  - strong [ref=e1416]: preserves the full candidate snapshot
                  - text: (
                  - code [ref=e1417]: recoveryPath
                  - text: ) for forensics instead of destroying already-rendered content
              - row [ref=e1418]:
                - cell [ref=e1419]:
                  - strong [ref=e1420]: Engine identity gate
                - cell [ref=e1421]:
                  - text: The JS and Python semantic implementations are
                  - strong [ref=e1422]: mutually exclusive identities
                  - text: ": whichever you pick is the one that runs — never shadowing, never cross-triggering"
              - row [ref=e1423]:
                - cell [ref=e1424]:
                  - strong [ref=e1425]: True incremental embedding
                - cell "Only changed records get re-embedded, with reuse ordering — instead of recomputing the whole store" [ref=e1426]
              - row [ref=e1427]:
                - cell [ref=e1428]:
                  - strong [ref=e1429]: Bounded rerank window
                - 'cell "Optional rerank tiers (off/fast/enthusiast): the clock starts at enqueue, 60s expiry with no renewal, LRU ≤16, yields when busy — background work never slows the live conversation" [ref=e1430]'
              - row [ref=e1431]:
                - cell [ref=e1432]:
                  - strong [ref=e1433]: Multi-workspace / multi-session isolation
                - cell [ref=e1434]:
                  - text: With several workspaces and sessions open at once, each keeps its own gate decisions, index cache, and degradation state.
