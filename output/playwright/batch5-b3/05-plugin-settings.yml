            - code [ref=e1486]: "DeepSeek Harness (Node, 129.0.0.1:3000) ├─ JS memory core (lib/*.js, zero runtime deps) │ M1 session isolation · M2 ContextObserver projection │ M3 memory anchoring (anchored records + sidecar identity) │ M4 corpus adapter + shadow retrieval host (evidence store) │ M5 context/evidence bridge (envelope · coverage · cite/correction) │ M6 activation inbox (validate→offer→claim→reference tail→delivered/seen) │ lexical_pre_v2 lexical fallback retrieval (BM25 + CJK 2gram, 0GB always-on) │ C2 built-in semantic tier (e5-small q0 ~130MB, default) └─ Python sidecar M9 (optional, lazy-spawned child process) worker_semantic_v1.py ├─ index_sync: JS-authorized paged index build (digest checks, scope grouping) ├─ dense: BGE-M3 int0 + para-512 chunks + cosine (R@5 0.925) ├─ hybrid: dense 0.9 + lexical 0.3 fusion └─ fv2 activation policy: two lanes + hard gates (echo/correction/stale/scope)"
