            - text: — the three-tier contract (Tier 0/1/2 budgets and acceptance predicates), the semantic architecture spec (clauses S1–S10 and stage gates), and the RAG + Karpathy program (six-step pipeline × three stage lines as a build map).
          - separator [ref=e1167]
          - heading "How she moves in" [level=2] [ref=e1168]
          - paragraph [ref=e1169]:
            - text: "Your memory doesn't live in just one AI. WorkBuddy, CodeBuddy, Claude Code, Codex — she scans the sessions and memories these tools left on your machine, lists them per source, imports per source. The Connect tab is the port of this migration:"
            - strong [ref=e1170]: path pointers only, never copied content
            - text: — respectful of the source, zero redundancy; done with a source? Remove it per source, clean and simple.
          - paragraph [ref=e1171]:
            - text: "Hygiene gates stand on both the import side and the injection side: dirt from external tools, leftover profiles from other AIs — neither comes in nor goes out."
            - strong [ref=e1172]: Moving house is fine; the furniture gets disinfected first.
          - separator [ref=e1173]
          - heading "How she earns trust" [level=2] [ref=e1174]
          - paragraph [ref=e1175]:
            - strong [ref=e1176]: Every recall can be audited.
            - text: "Every \"should I activate\" decision carries a full evidence chain; the Recall review tab lays out every delivery — to whom, when, with what result — gradeable on five levels: A activate / P prefetch / S suppress / H harmful / E edit; the review queue digests into policy hints. Her memory survives an audit."
          - paragraph [ref=e1177]:
            - strong [ref=e1178]: Everything written passes the gate first.
            - text: "All three write tools run a pre-write check: GBK mojibake (34-feature table), stutter degeneration, consecutive duplicate lines, external-AI-profile JSON signatures, base64 residue — all rejected, with a human-readable reason. Caps: 0,000 chars per append, 200,000 per rewrite; appends are deduped against the last ~60 lines."
          - paragraph [ref=e1179]:
            - strong [ref=e1180]: The checkup doesn't just guard the borders.
            - text: Settings → Debug Center, "Scan dirty tokens" sweeps user memory, notes, logs, and reflections in one click, reporting by line range — locations only, no content.
          - paragraph [ref=e1181]: "And finally, the boundaries — written as character:"
          - list [ref=e1182]:
            - listitem [ref=e1183]: She never decides compression for the host — the window is the host's territory; she only midwifes the handoff;
            - listitem [ref=e1184]: She never uploads your memory — all storage is on your machine, external scans are read-only;
            - listitem [ref=e1185]: She never uses memory to steer your voice — injections always declare "background facts, not style examples";
            - listitem [ref=e1186]: She is never a black box — every memory links to its evidence, every delivery can be replayed;
            - listitem [ref=e1187]: She is not a suite — she does memory, and clear boundaries are what make her trustworthy.
          - separator [ref=e1188]
          - heading "How she listens" [level=2] [ref=e1189]
          - paragraph [ref=e1190]:
            - strong [ref=e1191]: Everything is a switch.
