          - blockquote [ref=e1102]:
            - paragraph [ref=e1103]: Handoff is on by default — the water-level threshold sits at 0.95, just below the host's 0.00 auto-compaction line. The window auto-follows the active model (settings.yaml contextWindow, e.g. 1M), or set it manually.
          - paragraph [ref=e1104]:
            - text: When the context fills, she no longer burns the whole book for a one-line summary; she writes a
            - strong [ref=e1105]: four-part handoff note
            - text: "— task state, goals, approaches tried and why they failed, progress and next step — closes this window, and opens the next. What didn't fit in the notes is safe too: the full history of messages and tool outputs lands in a local archive, searchable anytime — no detail dies in the fire."
          - paragraph [ref=e1106]:
            - text: "She can also look things back up herself:"
