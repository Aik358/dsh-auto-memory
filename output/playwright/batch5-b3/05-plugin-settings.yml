          - blockquote [ref=e1159]:
            - paragraph [ref=e1160]:
              - text: "A real recorded misstep: board v1 squeezed 92 files into 92 cards and left three swimlanes permanently empty."
              - strong [ref=e1161]: The root cause was not "too few cards" but a slicing granularity off by one level
              - text: (slicing by file instead of by the sections inside), compounded by a missing
              - code [ref=e1162]: break
