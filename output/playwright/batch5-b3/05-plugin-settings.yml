          - heading "The 3.0 rebuild (invisible to you — but every recall goes through it)" [level=3] [ref=e1385]
          - paragraph [ref=e1386]:
            - text: Most of this release adds no new buttons. It changes
            - emphasis [ref=e1387]: what makes a memory trustworthy
            - text: ". Eight mechanisms, all shipped and measured:"
          - table [ref=e1389]:
            - rowgroup [ref=e1390]:
