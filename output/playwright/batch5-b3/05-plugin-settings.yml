          - paragraph [ref=e1093]:
            - strong [ref=e1094]: "Distillation: trading process logs for reusable conclusions."
            - text: Daily logs older than 30 days are read through, and only what carries cross-session value is distilled — technical decisions, architecture conventions, preferences, hard-won pitfalls — into project notes; originals are archived as a floor, degrading to verbatim archiving if the AI is unavailable —
            - strong [ref=e1095]: not a single character lost
            - text: ". The recall boundary is just as clear: skills, user-level and project notes are never distilled — only date-named logs go through, and the untouchable stays untouched."
          - paragraph [ref=e1096]:
            - strong [ref=e1097]: "Skills: like riding a bicycle — no need to think about how."
            - text: "After learning to ride, a person never replays the tutorial — muscle memory takes over. She grows that too: after watching your corrections a few times, or repeating similar work, a workflow crystallizes into a skill; next time something similar appears, the checklist attaches itself. Injection comes in three grades — full steps / excerpt / hint — with high-risk scenarios auto-downgraded to a hint, never in the way. Skills promote gradually on cross-session evidence, approved in the Memory Hub tab; 90 days unused and they auto-archive, important ones can be pinned, frequently used ones stay gently warm."
          - paragraph [ref=e1098]:
            - strong [ref=e1099]: "Reflections: before closing the books each day, she writes her own review."
            - text: Results, lessons, next steps — in a reflection layer of their own; the first session of the next day presents yesterday's review. From Monday on, your project has someone who remembers everything yesterday said.
