          - paragraph [ref=e751]: "Two rules matter more than the rest:"
          - list [ref=e752]:
            - listitem [ref=e753]:
              - strong [ref=e754]: Checkpoints are append-only.
              - text: History is never rewritten; corrections are new checkpoints with
