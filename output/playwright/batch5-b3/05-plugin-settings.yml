          - separator [ref=e663]
          - heading "One week" [level=2] [ref=e664]
          - paragraph [ref=e665]: Monday, you hand her a research task and shut the laptop halfway through.
          - paragraph [ref=e666]: Wednesday, you're on a different machine and have switched the default model while you were at it. What she picks up is not "sorry, I don't remember" — it's last week's progress, three dead ends already tried, and the next step. The handoff note is there, the raw record is searchable, and the memory travels with you.
          - paragraph [ref=e667]: "Friday, you ask casually: \"Why do you remember this?\" She shows you: which message, which tool output, which late-night reflection it came from. You can have her hold onto it tighter — or let it go."
          - paragraph [ref=e668]:
            - strong [ref=e669]: She remembers, unbidden. And if you want her to forget — that's one sentence too.
