            - strong [ref=e1192]: welcome tour
            - text: ": one Office/Fluent-style liquid-glass app icon per step — cyan inject, amber greeting, green calendar, violet engine, sky radar, coral finish — each with its own looping motion (bell sway, page flip, linked rings, prism spin, radar sweep, rising spark). Flip every feature right in the tour; switches write config instantly, no second trip to settings. The semantic engine's detection, download, and self-test are inline in the tour, done in one pass. External memory sources are scanned live, ticked per source. Close it halfway without worry — the final \"finish\" step tells you exactly where each switch lives in Settings."
          - paragraph [ref=e1193]:
            - text: "One-time catch-up for upgraders: from v0.1.30 every user auto-plays the full tour once after upgrading, then the changelog follows (skippable). Reopen anytime via"
            - strong [ref=e1194]: Settings → Appearance → Welcome tour → ▶ Replay
            - text: .
          - paragraph [ref=e1195]: "Settings and the tour are twin entrances, mapped one-to-one: proactive recall, periodic snapshots, away greetings, night unattended, daily reflection, scheduled digests, external memory, skill crystallization, auto-open… every switch carries a description, the UI switches between Chinese and English, and the panel font size is adjustable."
          - paragraph [ref=e1196]:
