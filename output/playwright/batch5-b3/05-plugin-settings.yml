          - heading "The burned book keeps no book report" [level=2] [ref=e542]
          - paragraph [ref=e543]: "Everyone who does real work with AI knows the moment: halfway through, the context window fills, and she \"forgets\". Not for lack of intelligence — her thinking was compressed into a summary, like burning a whole book and keeping one line of book report. Why that fix failed, why that path dead-ended — all in the fire."
          - paragraph [ref=e544]: "dsh-auto-memory never believed it had to be this way. She keeps memory outside the window: what should resurface, resurfaces unbidden; and everything she recalls has provenance — checkable, editable, deletable."
          - paragraph [ref=e545]:
            - text: Now we push this route to its last missing piece — when the context fills, she no longer compresses herself. She
