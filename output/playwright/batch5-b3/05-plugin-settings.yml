          - paragraph [ref=e761]:
            - text: The whiteboard (
            - code [ref=e762]: handoff/PLAN.md
            - text: ) is a
            - strong [ref=e763]: projection of events
            - text: ", not a hand-written document: change the events and it re-renders itself."
          - paragraph [ref=e764]:
            - text: Static discipline lives in the system prompt — byte-stable, keeps the prefix cache hot, never re-encodes history; dynamic memory rides a runtime snapshot — only the last day of logs plus a reflection digest are injected, everything else fetched on demand via
            - code [ref=e765]: memory_read
            - text: /
            - code [ref=e766]: memory_recall
            - text: .
            - strong [ref=e767]: Credential/secret sections are always filtered out of prompts.
          - paragraph [ref=e768]:
            - strong [ref=e769]: Memory writes itself.
            - text: "After every turn a small subagent quietly makes one judgment — what's worth keeping: long-term-valuable topics are grouped into today's log ("
            - code [ref=e770]: "## Topic (HH:MM)"
            - text: + bullets), durable decisions are promoted to project notes, cross-project rules to user-level memory, small talk skipped. Failures don't panic — they queue and retry every 5 minutes, with a 15-second heartbeat file proving the loop is alive. Daily writes have a budget; over budget, the AI merges and dedupes before writing — she remembers restraint, and she remembers not to lose things.
          - paragraph [ref=e771]:
            - text: "Then, periodically, she looks back:"
            - code [ref=e772]: memory_consolidate
            - text: reads recent logs and distills what deserves long-term promotion into project notes — auto-consolidation handles "log the flow each turn"; this handles "after a while, what's worth keeping".
          - separator [ref=e773]
          - heading "How she recalls" [level=2] [ref=e774]
          - paragraph [ref=e775]:
            - strong [ref=e776]: Never depends on the model "remembering to look".
            - text: "Existing memory solutions either rely on the model calling a retrieval tool, or on you pasting context by hand — skip it once, and the memory might as well not exist. This is host-side associative middleware: while the conversation runs, she watches context and runtime events continuously, and the relevant memories are retrieved, decided, and injected into the next turn before the model opens its mouth. Sent requests can't be rewritten, so injection runs at a fixed boundary —"
            - strong [ref=e777]: the prefix cache never goes cold, and tokens never pay twice for a memory.
            - text: "Her judging material is the dialogue itself: what you're thinking, what you said, what she answered; whether to recall, and what to recall, is decided live by the semantic model — not \"look it up when I remember\", but remembering while doing."
          - paragraph [ref=e778]:
            - text: "Powers are separated too: what to recall belongs to the semantic decision layer; whether and when belongs to the identity/authorization/timing governance layer — every delivery carries an evidence chain. Every page she hands over has also passed inspection: injected content is neutralized for template variables at every exit — a plain"
            - code [ref=e779]: "{{baseUrl}}"
            - text: in a log can no longer brick an entire turn.
          - paragraph [ref=e780]:
            - text: "Ask, and she answers:"
            - code [ref=e781]: memory_recall
            - text: returns a layered summary list first (each memory as a ~90-character digest with id, score and match reason), fused across lexical + semantic + time arms — ask for "last week's release trouble" and the memories from that window surface first; expand any id for the full text. Replies are conversational with sources cited.
            - code [ref=e782]: memory_recall
            - text: is cross-workspace by nature — other projects' logs, notes, and conclusions are one sentence away.
          - paragraph [ref=e783]:
            - text: "The panel's Workspace tab draws all of this as a mind map: workspaces at the center, memory topics as branches, dashed lines for cross-workspace shares; draggable, zoomable, click a card for details."
            - strong [ref=e784]: Your memory has a shape for the first time.
