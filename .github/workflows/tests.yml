name: tests(全量 smoke 回归)

# issue #73 修复（2026-09-19）：仓库此前只有 group-digest / group-report-status 两条
# workflow，**都不跑测试** ⇒ 红测试静默积累（"回归全绿"失去可信度）。
# 本 workflow 在每次 push / PR 上跑**全量 smoke 套件**，让回归红立刻可见。
#
# ★ 为什么要 --exclude：
#   有几类套件在**全新克隆**里必然不可用（不是代码坏了，是夹具不在仓库里）：
#     ① live 套件（smoke-test-*-live-pre.mjs）：需要真实网络下载模型/peer 包。
#     ② m79-feature-v2-pre / m710-fv2-emit-pre：依赖 python/bench/.venv（.gitignore:9）。
#     ③ c4-fresh-install-pre：依赖 artifacts/release-c2-asset-pack/*.tgz（.gitignore:25）。
#   排除它们**不等于**放弃覆盖：这三类在本地/发布前按需单独跑（见 docs 的发布检查单）。
#   其余套件全部在 CI 跑，任何红都会让 job 失败 ⇒ 不再静默积累。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 本插件零运行时依赖（package.json 无 dependencies），因此**不跑 install**：
      # 装依赖会引入非确定性，而这里要验的正是"仓库原样即可跑"。
      - name: 环境自述
        run: |
          node --version
          npm --version
          echo "--- 套件总数 ---"
          ls tests/smoke/*.mjs | wc -l

      - name: 全量 smoke 回归（排除依赖本地产物/网络的套件）
        run: |
          node tools/run-smoke.mjs \
            --timeout=90000 \
            --exclude=-live- \
            --exclude=m79-feature-v2-pre \
            --exclude=m710-fv2-emit-pre \
            --exclude=c4-fresh-install-pre

      - name: 回归失败时打印定位提示
        if: failure()
        run: |
          echo "::error::全量 smoke 有 FAIL/TIMEOUT。上方 '--- FAIL: <套件名> ---' 段落给出了该套件的输出尾部。"
          echo "本地复现：node tools/run-smoke.mjs --filter=<套件名关键字>"
