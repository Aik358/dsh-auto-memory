<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="身份流示意图">
<defs>
  <marker id="arE" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker>
  <marker id="arS" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 z" fill="#64748b"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="900" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/>
<text x="60" y="48" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" fill="#0f172a" font-weight="700">身份流 · 登录 → 成员映射 → actor 注入 → 审计</text>
<text x="60" y="78" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">device code 流程不依赖回调：客户端只轮询，令牌只存宿主侧；两条登录路径产出等价身份</text>
<line x1="60" y1="92" x2="1340" y2="92" stroke="#cbd5e1" stroke-width="2"/>
<rect x="80" y="110" width="240" height="128" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="96" y="140" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#334155" font-weight="700">① 桌面登录</text>
<text x="96" y="164" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">由宿主发起授权</text>
<text x="96" y="186" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">浏览器 / 设备码两路</text>
<text x="96" y="208" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">令牌只存宿主侧</text>
<line x1="320" y1="174" x2="332" y2="174" stroke="#94a3b8" stroke-width="2" marker-end="url(#arE)"/>
<rect x="334" y="110" width="240" height="128" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="350" y="140" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#334155" font-weight="700">② 成员身份映射</text>
<text x="350" y="164" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">企业 IdP 映射 userId</text>
<text x="350" y="186" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">设备指纹绑定本机</text>
<text x="350" y="208" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">产出 actor 三元组</text>
<line x1="574" y1="174" x2="586" y2="174" stroke="#94a3b8" stroke-width="2" marker-end="url(#arE)"/>
<rect x="588" y="110" width="240" height="128" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="604" y="140" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#334155" font-weight="700">③ actor 注入</text>
<text x="604" y="164" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">写盘时统一注入</text>
<text x="604" y="186" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">前端不可改写</text>
<text x="604" y="208" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">缺失即 fail-closed</text>
<line x1="828" y1="174" x2="840" y2="174" stroke="#94a3b8" stroke-width="2" marker-end="url(#arE)"/>
<rect x="842" y="110" width="240" height="128" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="858" y="140" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#334155" font-weight="700">④ 同步与授权</text>
<text x="858" y="164" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">按 actor 判范围</text>
<text x="858" y="186" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">跨域动作校验角色</text>
<text x="858" y="208" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">越权即拒并告警</text>
<line x1="1082" y1="174" x2="1094" y2="174" stroke="#94a3b8" stroke-width="2" marker-end="url(#arE)"/>
<rect x="1096" y="110" width="240" height="128" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="1112" y="140" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#334155" font-weight="700">⑤ 审计落盘</text>
<text x="1112" y="164" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">记录操作者与时间</text>
<text x="1112" y="186" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">改动前后版本留痕</text>
<text x="1112" y="208" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">治理层可导出取证</text>
<rect x="80" y="270" width="1010" height="250" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="100" y="298" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#1e3a8a" font-weight="700">设备码流程（device code · 无回调依赖）</text>
<text x="1078" y="298" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569" text-anchor="end">全程不需要本地监听端口</text>
<rect x="100" y="314" width="305" height="100" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
<circle cx="124" cy="338" r="13" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="124" y="343" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="146" y="343" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#1e3a8a" font-weight="700">申请设备码</text>
<text x="116" y="370" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">客户端 → 授权服务</text>
<text x="116" y="390" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">携带设备指纹与版本</text>
<text x="116" y="410" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">返回 user_code 与地址</text>
<rect x="425" y="314" width="305" height="100" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
<circle cx="449" cy="338" r="13" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="449" y="343" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="471" y="343" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#1e3a8a" font-weight="700">用户浏览器授权</text>
<text x="441" y="370" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">任意设备打开验证地址</text>
<text x="441" y="390" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">登录企业 IdP 并确认</text>
<text x="441" y="410" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">确认授权成员与范围</text>
<rect x="750" y="314" width="305" height="100" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
<circle cx="774" cy="338" r="13" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="774" y="343" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="796" y="343" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#1e3a8a" font-weight="700">客户端轮询</text>
<text x="766" y="370" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">每 5 秒轮询一次</text>
<text x="766" y="390" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">慢下来由服务端指示</text>
<text x="766" y="410" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">超时即重新申请</text>
<rect x="100" y="426" width="305" height="100" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
<circle cx="124" cy="450" r="13" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="124" y="455" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="146" y="455" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#1e3a8a" font-weight="700">服务端签发令牌</text>
<text x="116" y="482" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">access + refresh 双令牌</text>
<text x="116" y="502" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">令牌只存宿主侧凭据库</text>
<text x="116" y="522" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">前端不可读取</text>
<rect x="425" y="426" width="305" height="100" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
<circle cx="449" cy="450" r="13" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="449" y="455" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="471" y="455" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#1e3a8a" font-weight="700">身份映射</text>
<text x="441" y="482" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">企业身份 → userId / teamId</text>
<text x="441" y="502" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">绑设备指纹 → 本地 actor</text>
<text x="441" y="522" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">产出 actor 三元组</text>
<rect x="750" y="426" width="305" height="100" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
<circle cx="774" cy="450" r="13" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="774" y="455" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<text x="796" y="455" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#1e3a8a" font-weight="700">注入与审计</text>
<text x="766" y="482" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">写盘时宿主统一注入</text>
<text x="766" y="502" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">缺失 actor 即拒绝写入</text>
<text x="766" y="522" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">审计含 actor 与版本</text>
<line x1="405" y1="364" x2="424" y2="364" stroke="#93c5fd" stroke-width="2" marker-end="url(#arE)"/>
<line x1="730" y1="364" x2="749" y2="364" stroke="#93c5fd" stroke-width="2" marker-end="url(#arE)"/>
<line x1="750" y1="466" x2="750" y2="486" stroke="#93c5fd" stroke-width="2" marker-end="url(#arE)"/>
<text x="760" y="480" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">服务端确认后客户端才拿到令牌</text>
<line x1="425" y1="476" x2="404" y2="476" stroke="#93c5fd" stroke-width="2" marker-end="url(#arE)"/>
<line x1="100" y1="476" x2="81" y2="476" stroke="#93c5fd" stroke-width="2" marker-end="url(#arE)"/>
<rect x="1100" y="270" width="240" height="250" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1116" y="298" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#9a3412" font-weight="700">桌面回调（可选）</text>
<text x="1116" y="326" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#7c2d12">本地环回回调地址</text>
<text x="1116" y="350" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#7c2d12">仅允许环回或 https</text>
<text x="1116" y="374" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#7c2d12">无环回能力时自动</text>
<text x="1116" y="398" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#7c2d12">降级为设备码流程</text>
<text x="1116" y="422" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#7c2d12">两条路径身份等价</text>
<text x="1116" y="446" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#7c2d12">不引入任何外链脚本</text>
<text x="1116" y="496" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#9a3412" font-weight="700">二者选一 · 不得混用</text>
<rect x="80" y="540" width="302" height="176" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="96" y="568" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#334155" font-weight="700">令牌与存储</text>
<text x="96" y="596" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">刷新令牌入系统凭据库</text>
<text x="96" y="620" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">（keytar / DPAPI）</text>
<text x="96" y="644" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">按设备隔离，登出即撤销</text>
<text x="96" y="668" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">令牌不得写入日志或前端</text>
<rect x="397" y="540" width="302" height="176" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="413" y="568" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#334155" font-weight="700">身份映射表</text>
<text x="413" y="596" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">企业身份 → 团队身份 → 本地 actor</text>
<text x="413" y="620" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">映射变更即时生效</text>
<text x="413" y="644" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">旧 actor 只读保留</text>
<text x="413" y="668" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">映射失败时拒绝写入</text>
<rect x="714" y="540" width="302" height="176" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="730" y="568" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#334155" font-weight="700">actor 注入点</text>
<text x="730" y="596" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">宿主统一注入，覆盖全部写路径</text>
<text x="730" y="620" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">写入前校验 actor 有效性</text>
<text x="730" y="644" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">越权字段由治理策略拦截</text>
<text x="730" y="668" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">注入失败 = 拒绝写盘</text>
<rect x="1031" y="540" width="302" height="176" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="1047" y="568" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#334155" font-weight="700">审计与取证</text>
<text x="1047" y="596" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">写审计：actor / 时间 / 版本</text>
<text x="1047" y="620" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">可按成员与会话导出</text>
<text x="1047" y="644" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">留存期由治理策略约束</text>
<text x="1047" y="668" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">审计不可由前端修改</text>
<rect x="80" y="730" width="1260" height="68" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="100" y="756" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#991b1b" font-weight="700">fail-closed 边界</text>
<text x="100" y="782" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#7c2d12">无有效 actor → 拒绝写入；令牌过期且刷新失败 → 停止上行并提示重新登录；映射缺失 → 本地可继续，共享只读。</text>
<rect x="80" y="812" width="1260" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<rect x="96" y="826" width="18" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="120" y="839" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">本地私有（蓝）</text>
<rect x="264" y="826" width="18" height="16" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="288" y="839" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">团队共享（紫）</text>
<rect x="432" y="826" width="18" height="16" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="456" y="839" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">企业治理（橙）</text>
<rect x="600" y="826" width="18" height="16" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="624" y="839" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">危险 / 拒绝（红）</text>
<rect x="796" y="826" width="18" height="16" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="820" y="839" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">成功 / 已授权（绿）</text>
<rect x="976" y="826" width="18" height="16" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="1000" y="839" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">中性 / 结构（灰）</text>
<text x="1124" y="839" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">虚线框＝可选路径</text>
<text x="1340" y="886" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8" text-anchor="end">dsh-auto-memory · teamwork research · 2026-09</text>
</svg>