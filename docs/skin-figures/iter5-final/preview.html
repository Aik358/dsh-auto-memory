<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>三套皮肤 · 最终实拍</title><style>body{margin:24px;background:#f4f7fb;color:#173052;font:16px/1.6 system-ui}h1{font-size:24px}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}select{padding:8px}img{max-width:100%;height:auto;border:1px solid #d8e1ef;border-radius:8px}p{color:#4b607c}</style><h1>三套皮肤 · 最终实拍</h1><p>隔离 DSH web 宿主，真实插件与验收数据。蓝白基调，分类色在组件间一致。</p><nav><select id="skin" aria-label="皮肤"><option value="instrument">仪器</option><option value="editorial">编辑</option><option value="water">活水</option></select><select id="mode" aria-label="明暗"><option value="light">浅色</option><option value="dark">深色</option></select><select id="width" aria-label="屏幕宽度"><option>1440</option><option>390</option></select></nav><img id="shot" alt="皮肤实拍"><script>function render(){document.getElementById('shot').src=skin.value+'-'+mode.value+'-'+width.value+'.png'}document.querySelectorAll('select').forEach(el=>el.onchange=render);render()</script></html>
