<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0d14" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef2f7" />
<title>dsh-auto-memory · 新版界面演示 v2（范围已标注）</title>
<style>
/* ============================================================
   dsh-auto-memory 新版 UI 演示稿 v2 · 单文件 · 零外部依赖
   色板真源：R3-V2-SPEC §5.1（20 值，不得另创）
   信息架构真源：R3-V2-SPEC §2（Lead 拍板）
   机制真源：docs/internal/R3-MECHANISM-MAP.md（lib/client.js 行号锚点）
   缺口依据：docs/internal/R3-DEMO-GAP-AUDIT.md（P0 六项）
   ============================================================ */
:root{
  /* —— 深色（v2 默认）—— */
  --bg:#0a0d14;  --bg-soft:#141828;  --bg-elev:#0f1320;  --bg-code:#05070d;
  --fg:#e8ecf3;  --fg-dim:#b8c0d0;
  --accent:#3b82f6;  --accent-2:#60a5fa;  --accent-3:#93c5fd;
  /* —— 语义色 —— */
  --ok:#2fa46a;  --warn:#d4a94f;  --err:#c44a4a;  --info:#4f7cff;  --muted:#8b93a5;
  --accent-soft:rgba(59,130,246,.14);
  --accent-glow:rgba(59,130,246,.32);
  --ok-soft:rgba(47,164,106,.14);
  --warn-soft:rgba(212,169,79,.16);
  --err-soft:rgba(196,74,74,.16);
  --info-soft:rgba(79,124,255,.14);
  --muted-soft:rgba(139,147,165,.14);
  /* —— 面 / 线 —— */
  --line:rgba(232,236,243,.10);
  --line-2:rgba(232,236,243,.18);
  --line-3:rgba(232,236,243,.28);
  --shadow:0 14px 38px rgba(0,0,0,.46);
  /* —— 动效令牌（SPEC §5.2：150–250ms / cubic-bezier(.2,.8,.2,1)）—— */
  --dur-quick:150ms;
  --dur-fast:250ms;
  --ease:cubic-bezier(.2,.8,.2,1);
  /* —— 字体（system-ui / ui-monospace 兜底，零网络请求）—— */
  --font-title:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
  --font-body:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace;
  --r-sm:8px; --r:10px; --r-lg:14px;
}
html[data-theme="light"]{
  --bg:#eef2f7;  --bg-soft:#e2e8f0;  --bg-elev:#ffffff;  --bg-code:var(--bg-soft);
  --fg:#0f172a;  --fg-dim:#334155;
  --accent:#2563eb;  --accent-2:#3b82f6;  --accent-3:#2563eb;
  --accent-soft:rgba(37,99,235,.10);
  --accent-glow:rgba(37,99,235,.20);
  --ok-soft:rgba(47,164,106,.12);
  --warn-soft:rgba(212,169,79,.18);
  --err-soft:rgba(196,74,74,.12);
  --info-soft:rgba(79,124,255,.12);
  --muted-soft:rgba(139,147,165,.16);
  --line:rgba(15,23,42,.10);
  --line-2:rgba(15,23,42,.20);
  --line-3:rgba(15,23,42,.34);
  --shadow:0 14px 38px rgba(15,23,42,.14);
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:var(--font-body);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{font-family:var(--font-title);font-weight:600;letter-spacing:-.012em;line-height:1.32}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;text-align:left}
input,select,textarea{font:inherit;color:inherit}
ul,ol{margin:0;padding:0;list-style:none}
table{border-collapse:collapse;width:100%}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--fg-dim)}
.mute{color:var(--muted)}
.tiny{font-size:12px}
.nowrap{white-space:nowrap}
.sec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
::selection{background:var(--accent-glow)}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:6px}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ================= 外壳：左导航 + 主区 ================= */
.app{display:grid;grid-template-columns:246px minmax(0,1fr);height:100dvh;overflow:hidden}
.sidebar{
  display:flex;flex-direction:column;gap:12px;padding:14px 11px 11px;min-width:0;
  background:var(--bg-elev);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;
}
.brand{display:flex;align-items:center;gap:9px;padding:2px 6px 10px;border-bottom:1px solid var(--line)}
.brand-mark{
  width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent-2),var(--accent));color:#fff;
  font-family:var(--font-mono);font-size:12px;font-weight:700;
  box-shadow:0 0 0 1px var(--line-2) inset,0 6px 16px var(--accent-glow)}
.brand-name{font-family:var(--font-title);font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--muted)}
.ver-chip{font-family:var(--font-mono);font-size:10.5px;color:var(--accent-3);
  background:var(--accent-soft);border:1px solid var(--line-2);border-radius:999px;padding:1px 7px;margin-left:auto;flex:none}

.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  position:relative;display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 10px 9px 12px;border-radius:var(--r-sm);color:var(--fg-dim);
  transition:background var(--dur-quick) var(--ease),color var(--dur-quick) var(--ease);
}
.nav-item .ico{width:18px;text-align:center;font-size:15px;flex:none;opacity:.92}
.nav-item .lbl{font-size:13.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted);flex:none}
.nav-item::before{
  content:"";position:absolute;left:4px;top:9px;bottom:9px;width:2px;border-radius:2px;
  background:var(--accent-2);transform:scaleY(0);transform-origin:center;
  transition:transform var(--dur-fast) var(--ease)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.nav-item[aria-current="page"]::before{transform:scaleY(1)}
.nav-item.util{border:1px dashed var(--line-2)}
.nav-item .tag-pill{margin-left:auto;font-size:10px;font-family:var(--font-mono);flex:none}
@media (hover:hover) and (pointer:fine){
  .nav-item:hover{background:var(--bg-soft);color:var(--fg)}
}
.side-card{border:1px solid var(--line);border-radius:var(--r);background:var(--bg-soft);padding:10px 11px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:11px;border-top:1px solid var(--line)}
.who{display:flex;align-items:center;gap:9px;padding:8px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--bg-soft);min-width:0}
.who .avatar{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:600;color:#fff;background:linear-gradient(150deg,var(--accent-2),var(--accent))}
.who .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .sb{font-size:11px;color:var(--muted)}

.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{
  display:flex;align-items:center;gap:10px;padding:11px 18px;min-width:0;
  border-bottom:1px solid var(--line);background:var(--bg-elev);
}
.crumb{display:flex;align-items:center;gap:8px;font-family:var(--font-title);font-size:15px;font-weight:600;min-width:0}
.crumb .sep{color:var(--muted);font-weight:400}
.crumb > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}

/* 双库图例（P0-6：作用域只有 通用库 / 本工作区库） */
.legend{display:flex;align-items:center;gap:9px;padding:5px 10px;border:1px solid var(--line);
  border-radius:999px;background:var(--bg-soft)}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-dim);white-space:nowrap}
.legend .sep{width:1px;height:14px;background:var(--line-2)}

/* 二级真页签 */
.l2{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--bg-elev);overflow-x:auto}
.l2::-webkit-scrollbar{height:6px}
.l2-tab{
  position:relative;padding:11px 12px 12px;color:var(--fg-dim);font-size:13.5px;white-space:nowrap;
  transition:color var(--dur-quick) var(--ease)}
.l2-tab::after{
  content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;
  background:var(--accent-2);transform:scaleX(0);transform-origin:left center;
  transition:transform var(--dur-fast) var(--ease)}
.l2-tab[aria-selected="true"]{color:var(--fg);font-weight:600}
.l2-tab[aria-selected="true"]::after{transform:scaleX(1)}
@media (hover:hover) and (pointer:fine){ .l2-tab:hover{color:var(--fg)} }

.screens{flex:1;overflow-y:auto;overflow-x:hidden;min-width:0}
.screen{display:none;padding:18px 20px 60px;max-width:1640px}
.screen.is-active{display:block;animation:scrIn var(--dur-fast) var(--ease) both}
@keyframes scrIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.screen-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.screen-head .h1{font-size:19px}
.screen-head .sub{font-size:12.5px;color:var(--fg-dim);margin-top:3px;max-width:820px}
.screen-head .acts{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.anchor-note{font-size:11.5px;color:var(--muted);margin-top:4px}

/* ================= 规划中（诚实标注，SPEC §4）================= */
.planned-bar{
  display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border-radius:var(--r-lg);
  border:1px solid var(--warn);background:var(--warn-soft);margin-bottom:14px}
.planned-bar .mk{flex:none;font-size:16px;line-height:1.25;color:var(--warn)}
.planned-bar .t{font-size:13.5px;font-weight:600;color:var(--fg)}
.planned-bar .d{font-size:12.5px;color:var(--fg-dim);margin-top:3px}
.badge.planned{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.is-planned{filter:saturate(.45)}
.is-planned .card,.is-planned .kcard{background:var(--bg-soft)}
.rule-h{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.rule-h .t{font-family:var(--font-title);font-size:14.5px;font-weight:600;flex:none}
.rule-h .r{flex:1;height:1px;background:var(--line)}
.rule-h .h{font-size:11.5px;color:var(--muted);flex:none}

/* ================= 通用件 ================= */
.card{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.card-pad{padding:15px 16px}
.grid{display:grid;gap:13px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.wrap{flex-wrap:wrap}
.top{align-items:flex-start}
.spread{display:flex;align-items:center;gap:10px;justify-content:space-between;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.ovw{overflow-wrap:anywhere}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 12px;border-radius:var(--r-sm);
  font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap;
  transition:transform var(--dur-quick) var(--ease),background var(--dur-quick) var(--ease),
             border-color var(--dur-quick) var(--ease),color var(--dur-quick) var(--ease),opacity var(--dur-quick) var(--ease)}
.btn:active{transform:scale(.975)}
.btn-primary{background:linear-gradient(160deg,var(--accent-2),var(--accent));color:#fff;box-shadow:0 6px 18px var(--accent-glow)}
.btn-outline{border-color:var(--line-2);color:var(--fg)}
.btn-ghost{color:var(--fg-dim)}
.btn-danger{border-color:var(--err);color:var(--err)}
.btn-warn{border-color:var(--warn);color:var(--warn)}
.btn-sm{padding:4px 9px;font-size:12px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
@media (hover:hover) and (pointer:fine){
  .btn-outline:hover{background:var(--bg-soft);border-color:var(--accent-2);color:var(--fg)}
  .btn-ghost:hover{background:var(--bg-soft);color:var(--fg)}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-danger:hover{background:var(--err-soft)}
  .btn-warn:hover{background:var(--warn-soft)}
}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:11.5px;font-weight:600;border:1px solid var(--line-2);color:var(--fg-dim);white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.badge.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.badge.err{color:var(--err);border-color:var(--err);background:var(--err-soft)}
.badge.info{color:var(--info);border-color:var(--info);background:var(--info-soft)}
.badge.acc{color:var(--accent-3);border-color:var(--accent-2);background:var(--accent-soft)}
.badge.muted{color:var(--muted);background:var(--muted-soft)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:5px;
  font-family:var(--font-mono);font-size:10.5px;color:var(--fg-dim);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-size:12px;border:1px solid var(--line);color:var(--fg-dim);background:var(--bg-soft);
  transition:border-color var(--dur-quick) var(--ease),color var(--dur-quick) var(--ease),background var(--dur-quick) var(--ease)}
.chip[aria-pressed="true"]{border-color:var(--accent-2);color:var(--fg);background:var(--accent-soft);font-weight:600}
@media (hover:hover) and (pointer:fine){ .chip:hover{border-color:var(--line-3);color:var(--fg)} }

/* 双库作用域徽标（P0-6） */
.scope-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid}
.scope-badge[data-scope="global"]{color:var(--info);border-color:var(--info);background:var(--info-soft)}
.scope-badge[data-scope="workspace"]{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.carrier-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:11.5px;font-weight:600;white-space:nowrap;border:1px dashed var(--line-2);color:var(--fg-dim);background:var(--bg-soft)}

.kv{display:flex;align-items:baseline;gap:8px;font-size:12.5px;min-width:0}
.kv .k{color:var(--muted);flex:none}
.kv .v{font-family:var(--font-mono);color:var(--fg-dim);overflow-wrap:anywhere}
.kvlist{display:flex;flex-direction:column;gap:6px}
.stat{padding:13px 15px}
.stat .n{font-family:var(--font-mono);font-size:21px;font-weight:600;letter-spacing:-.02em}
.stat .u{font-size:12px;color:var(--muted);margin-left:3px;font-family:var(--font-body)}
.stat .t{font-size:12px;color:var(--fg-dim);margin-top:2px}
.callout{display:flex;gap:10px;padding:10px 12px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--bg-soft);font-size:12.5px;color:var(--fg-dim)}
.callout .mk{flex:none;font-size:14px;line-height:1.3}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.err{border-color:var(--err);background:var(--err-soft)}
.callout.ok{border-color:var(--ok);background:var(--ok-soft)}
.callout.info{border-color:var(--info);background:var(--info-soft)}
.callout b{color:var(--fg)}
.meter{height:8px;border-radius:999px;background:var(--bg-code);border:1px solid var(--line);overflow:hidden;position:relative}
.meter > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transition:width var(--dur-fast) var(--ease)}
.meter.warn > i{background:linear-gradient(90deg,var(--warn),#e0bd6a)}
.meter .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn);
  transition:left var(--dur-fast) var(--ease)}
.tbl-wrap{overflow-x:auto;min-width:0}
.tbl{font-size:12.5px;min-width:520px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .t{font-family:var(--font-mono);color:var(--fg-dim);white-space:nowrap}
.tbl .first{color:var(--fg);font-weight:600}
@media (hover:hover) and (pointer:fine){ .tbl tbody tr:hover{background:var(--bg-soft)} }
.evidence{margin-top:14px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--bg-soft)}
.evidence > summary{padding:8px 12px;font-size:11.5px;color:var(--muted);cursor:pointer;list-style:none}
.evidence > summary::-webkit-details-marker{display:none}
.evidence > summary::before{content:"▸ ";color:var(--accent-3)}
.evidence[open] > summary::before{content:"▾ "}
.evidence .bd{padding:2px 12px 11px;font-size:11.5px;color:var(--fg-dim)}
.evidence .bd code{font-family:var(--font-mono);font-size:11px;color:var(--accent-3);background:var(--accent-soft);
  border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
.empty-hint{font-size:12px;color:var(--muted);padding:7px 2px}
.muted-box{border:1px dashed var(--line-2);border-radius:var(--r);padding:11px 12px;background:var(--bg-soft)}
.code{font-family:var(--font-mono);font-size:11.5px;background:var(--bg-code);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:9px 11px;color:var(--fg-dim);overflow-wrap:anywhere;white-space:pre-wrap}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
/* ================= 今天 · 水位（P0-2 / P0-3）================= */
.water-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.water-num{font-family:var(--font-mono);font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.water-num .pct{color:var(--warn)}
.water-src{margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.water-meter{margin-top:12px}
.water-scale{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin-top:5px}
.chain{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chain-step{flex:1;padding:10px 11px;background:var(--bg-elev);border-right:1px solid var(--line);min-width:0}
.chain-step:last-child{border-right:0}
.chain-step .n{font-family:var(--font-mono);font-size:10.5px;color:var(--accent-3)}
.chain-step .t{font-size:12.5px;font-weight:600;margin-top:3px}
.chain-step .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.chain-step[data-active="1"]{background:var(--accent-soft)}
.chain-step[data-miss="1"]{border-color:var(--err);background:var(--err-soft)}
.countdown{font-family:var(--font-mono);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.flow-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:13px;align-items:start}

/* ================= 今天 · 唤起回顾（P0-1）================= */
.sum-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.sum-cell{border:1px solid var(--line);border-radius:var(--r);background:var(--bg-soft);padding:10px 11px;
  display:flex;flex-direction:column;gap:3px;min-width:0}
.sum-cell .k{font-size:11.5px;color:var(--fg-dim);display:flex;align-items:center;gap:6px}
.sum-cell .k .key{font-family:var(--font-mono);font-size:10.5px;color:var(--accent-3);
  border:1px solid var(--line-2);border-radius:4px;padding:0 4px;flex:none}
.sum-cell .v{font-family:var(--font-mono);font-size:19px;font-weight:600}
.sum-cell[data-hit="1"]{border-color:var(--accent-2);background:var(--accent-soft)}
.day-group{margin-bottom:14px}
.day-head{display:flex;align-items:center;gap:10px;margin:0 0 9px}
.day-head .d{font-family:var(--font-mono);font-size:12.5px;font-weight:600;flex:none}
.day-head .n{font-size:11.5px;color:var(--muted);flex:none}
.day-head .r{flex:1;height:1px;background:var(--line)}
.obs{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--bg-elev);padding:12px 13px;margin-bottom:9px}
.obs-top{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap}
.obs-q{font-size:13.2px;font-weight:600;min-width:0;flex:1}
.obs-meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:8px}
.obs-why{font-size:11.5px;color:var(--muted);margin-top:7px}
.ape{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.ape-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--bg-soft);font-size:12px;color:var(--fg-dim);
  transition:border-color var(--dur-quick) var(--ease),background var(--dur-quick) var(--ease),color var(--dur-quick) var(--ease)}
.ape-btn .key{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.ape-btn[aria-pressed="true"]{border-color:var(--accent-2);background:var(--accent-soft);color:var(--fg);font-weight:600}
.ape-btn[aria-pressed="true"] .key{color:var(--accent-3)}
@media (hover:hover) and (pointer:fine){ .ape-btn:hover{border-color:var(--line-3);color:var(--fg)} }
.obs[data-sent="1"]{border-color:var(--accent-2)}
.obs-choice{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11.5px;color:var(--fg-dim)}

/* ================= 项目 · 看板泳道 ================= */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(178px,1fr));gap:10px;align-items:start}
.kanban.z1{grid-template-columns:minmax(0,1fr)}
.lane{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r-lg);
  display:flex;flex-direction:column;min-height:110px;overflow:hidden}
.lane[data-lane="deadend"]{border-color:var(--err)}
.lane-head{display:flex;align-items:center;gap:7px;padding:10px 11px;border-bottom:1px solid var(--line)}
.lane-head .dot{width:8px;height:8px;border-radius:50%;flex:none}
.lane-head .nm{font-size:12.5px;font-weight:600}
.lane-head .ct{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.lane-lv{font-family:var(--font-mono);font-size:10px;color:var(--red-fallback,var(--muted));padding:0 11px 4px}
.lane-body{padding:9px;display:flex;flex-direction:column;gap:8px}
.kcard{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;
  cursor:pointer;min-width:0;transition:border-color var(--dur-quick) var(--ease),transform var(--dur-quick) var(--ease)}
.kcard .t{font-size:12.6px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.kcard .m{font-size:11.5px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.kcard .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.kcard .why{font-size:11.5px;color:var(--err);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.kcard[data-lane="goal"]{border-left:3px solid var(--info)}
.kcard[data-lane="state"]{border-left:3px solid var(--ok)}
.kcard[data-lane="deadend"]{border-left:3px solid var(--err)}
.kcard[data-lane="progress"]{border-left:3px solid var(--warn)}
.kcard[data-lane="archive"]{border-left:3px solid var(--muted)}
.kcard[data-lane="misc"]{border-left:3px solid var(--line-3)}
@media (hover:hover) and (pointer:fine){ .kcard:hover{border-color:var(--accent-2);transform:translateY(-1px)} }
.kanban.zoom1 .kcard .t{font-size:12px}
.kanban.zoom1 .kcard .m{display:none}
.legend-lanes{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:10px}
.legend-lanes .li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-dim)}

/* ================= 项目 · 交接账本 ================= */
.four{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.seg{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--bg-elev);overflow:hidden;display:flex;flex-direction:column}
.seg-head{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line)}
.seg-idx{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none;
  font-family:var(--font-mono);font-size:11px;font-weight:700;color:#fff;background:var(--c,var(--accent))}
.seg-body{padding:11px 13px;font-size:12.8px;color:var(--fg-dim);display:flex;flex-direction:column;gap:8px}
.seg-body li{display:flex;gap:8px}
.seg-body li .b{flex:none;color:var(--muted);font-family:var(--font-mono);font-size:11px;line-height:1.7}
.seg.fail{border-color:var(--err)}
.timeline{position:relative;padding-left:18px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tl-item{position:relative;padding:0 0 13px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-16px;top:5px;width:8px;height:8px;border-radius:50%;
  background:var(--bg-elev);border:2px solid var(--c,var(--accent-2))}
.tl-when{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.tl-what{font-size:12.8px;margin-top:2px}
.skel{border:1px dashed var(--warn);border-radius:var(--r);background:var(--warn-soft);padding:10px 12px;font-size:12px;color:var(--fg-dim)}
.skel b{color:var(--fg)}

/* ================= 项目 · 知识中枢（P0-5）================= */
.hub-lib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.lib{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--bg-elev);padding:12px 13px}
.lib[data-scope="global"]{border-left:3px solid var(--info)}
.lib[data-scope="workspace"]{border-left:3px solid var(--ok)}
.lib .nm{font-size:13.5px;font-weight:600}
.lib .ct{font-family:var(--font-mono);font-size:19px;font-weight:600;margin-top:4px}
.lib .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.appr{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--bg-elev);padding:12px 13px;margin-bottom:10px}
.appr-top{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap}
.appr-t{font-size:13.2px;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.gate{border-radius:var(--r);border:1px solid var(--line);padding:9px 11px;font-size:12px;background:var(--bg-soft);margin-top:9px}
.gate .gt{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:7px}
.gate .gd{color:var(--fg-dim);margin-top:3px;font-size:11.8px}
.gate[data-gate="promote"]{border-color:var(--ok)}
.gate[data-gate="ask"]{border-color:var(--warn)}
.gate[data-gate="overridable"]{border-color:var(--warn)}
.gate[data-gate="structural"]{border-color:var(--line-2)}
.codes{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.code-chip{display:inline-flex;flex-direction:column;gap:1px;padding:4px 8px;border-radius:6px;
  border:1px solid var(--err);background:var(--err-soft);font-family:var(--font-mono);font-size:11px;color:var(--fg)}
.code-chip .zh{font-family:var(--font-body);font-size:10.5px;color:var(--fg-dim)}
.code-chip[data-tone="ok"]{border-color:var(--ok);background:var(--ok-soft)}
.code-chip[data-tone="muted"]{border-color:var(--line-2);background:var(--muted-soft)}
.appr-acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.appr[data-stage="deprecated"]{opacity:.62}
.rollback{border:1px solid var(--err);border-radius:var(--r);background:var(--err-soft);padding:10px 12px;font-size:12.3px;color:var(--fg-dim);margin-top:10px}
.rollback b{color:var(--fg)}
.rollback.pending{border-color:var(--warn);background:var(--warn-soft)}
.rollback.ok{border-color:var(--ok);background:var(--ok-soft)}

/* ================= 设置 · 外部记忆接入（P0-4）================= */
.src{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--bg-elev);padding:12px 13px}
.src[data-open="1"]{border-color:var(--accent-2)}
.src-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.src-mark{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;
  font-family:var(--font-mono);font-size:10.5px;font-weight:700;color:#fff;background:var(--muted)}
.src-mark[data-tool="wb"]{background:linear-gradient(150deg,#5b8def,#3b6fd8)}
.src-mark[data-tool="cc"]{background:linear-gradient(150deg,#c77b52,#a85f39)}
.src-mark[data-tool="cx"]{background:linear-gradient(150deg,#4f7cff,#2f5fe0)}
.src-mark[data-tool="zc"]{background:linear-gradient(150deg,#7a6bd8,#5b4cc0)}
.src .nm{font-size:13.2px;font-weight:600}
.src .path{font-family:var(--font-mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere;margin-top:3px}
.src-body{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.src-acts{display:flex;flex-wrap:wrap;gap:7px}
.arm-btn{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:var(--r-sm);
  font-size:12px;font-weight:600;border:1px solid var(--line-2);color:var(--fg-dim);
  transition:background var(--dur-quick) var(--ease),border-color var(--dur-quick) var(--ease),color var(--dur-quick) var(--ease)}
.arm-btn[data-armed="1"]{border-color:var(--err);background:var(--err-soft);color:var(--err)}
.arm-btn[data-done="1"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
@media (hover:hover) and (pointer:fine){ .arm-btn:hover{border-color:var(--line-3);color:var(--fg)} }
.arm-hint{font-size:11.5px;color:var(--err)}
.src-view{max-height:210px;overflow:auto;font-size:12.5px;background:var(--bg-code);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:10px 11px;display:flex;flex-direction:column;gap:7px}
.src-view .ln{color:var(--fg-dim);overflow-wrap:anywhere}
.src-view .ln .h{color:var(--fg);font-weight:600}

/* ================= 检索 · 日历（P1-2）================= */
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-h{font-size:11px;color:var(--muted);text-align:center;padding:2px 0;font-weight:600}
.cal-cell{min-height:82px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg-elev);
  padding:5px 6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0;
  transition:border-color var(--dur-quick) var(--ease),background var(--dur-quick) var(--ease)}
.cal-cell.out{opacity:.4}
.cal-cell.today{border-color:var(--accent-2);background:var(--accent-soft)}
@media (hover:hover) and (pointer:fine){ .cal-cell:hover{border-color:var(--line-3)} }
.cal-d{font-family:var(--font-mono);font-size:11px;color:var(--fg-dim)}
.cal-ev{font-size:10.5px;line-height:1.35;padding:2px 5px;border-radius:5px;border-left:3px solid var(--c,var(--muted));
  background:var(--bg-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-dim)}
.cal-ev .tm{font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin-right:3px}
.cal-ev.done{text-decoration:line-through;opacity:.62}
.cal-more{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.quad-legend{display:flex;flex-wrap:wrap;gap:9px;margin:11px 0}
.quad-legend .li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-dim)}
.quad-legend .qsw{width:9px;height:9px;border-radius:3px;flex:none;background:var(--c)}
.timeaxis{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.ts-row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:9px;align-items:start}
.ts-h{font-family:var(--font-mono);font-size:11px;color:var(--muted);padding-top:3px;text-align:right}
.ts-slot{min-height:26px;border-radius:var(--r-sm);border:1px dashed var(--line);padding:4px 6px;
  display:flex;flex-direction:column;gap:4px;background:var(--bg-elev)}
.ts-slot.has{border-style:solid;border-color:var(--line-2)}
.ts-off{font-family:var(--font-mono);font-size:11px;color:var(--warn);padding-top:3px;text-align:right}

/* ================= 检索 · 工作区关系图（P1-4）================= */
.graph{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--bg-elev);padding:12px 13px}
.graph-canvas{position:relative;height:270px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--bg-code);overflow:hidden;cursor:grab;touch-action:none}
.graph-canvas.dragging{cursor:grabbing}
.graph-canvas svg{position:absolute;inset:0;width:100%;height:100%}
.gnode{position:absolute;transform:translate(-50%,-50%);padding:4px 9px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--bg-elev);font-size:11.5px;white-space:nowrap;color:var(--fg-dim)}
.gnode[data-root="1"]{border-color:var(--accent-2);background:var(--accent-soft);color:var(--fg);font-weight:600}
.zoom-row{display:flex;align-items:center;gap:9px;margin-top:9px}
.zoom-row input[type="range"]{flex:1;min-width:80px;accent-color:var(--accent-2)}
.graph-hint{font-size:11.5px;color:var(--muted);margin-top:6px}

/* ================= 设置 ================= */
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;align-items:start}
.sgroup{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--bg-elev);overflow:hidden}
.sgroup-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sgroup-head .nm{font-family:var(--font-title);font-size:14px;font-weight:600}
.sgroup-head .key{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);
  border:1px solid var(--line);border-radius:4px;padding:0 4px}
.sgroup-head .sub{font-size:11.5px;color:var(--muted);flex:1;min-width:0}
.sgroup-body{padding:2px 14px 10px}
.srow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.srow:last-child{border-bottom:0}
.srow .lbl{font-size:12.8px;min-width:0}
.srow .hint{font-size:11.5px;color:var(--muted);margin-top:1px}
.srow .ctl{margin-left:auto;flex:none;display:flex;align-items:center;gap:8px}
.sw{position:relative;width:40px;height:22px;border-radius:999px;background:var(--bg-code);flex:none;
  border:1px solid var(--line-2);transition:background var(--dur-quick) var(--ease),border-color var(--dur-quick) var(--ease)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--muted);transition:transform var(--dur-fast) var(--ease),background var(--dur-quick) var(--ease)}
.sw[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent-2)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent-2)}
.radio{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden}
.radio button{padding:4px 10px;font-size:12.5px;color:var(--fg-dim);
  transition:background var(--dur-quick) var(--ease),color var(--dur-quick) var(--ease)}
.radio button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-3);font-weight:600}
.sel,.num,.txt{background:var(--bg-code);border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:4px 8px;font-size:12.5px;outline:0;transition:border-color var(--dur-quick) var(--ease)}
.sel:focus,.num:focus,.txt:focus{border-color:var(--accent-2)}
.num{width:88px;font-family:var(--font-mono);text-align:right}
.txt{width:150px;font-family:var(--font-mono)}
textarea.txt{width:100%;min-height:78px;font-family:var(--font-mono);line-height:1.5;resize:vertical}
.adv-wrap{border-top:1px dashed var(--line);padding:2px 0 0;display:none}
.sgroup.open .adv-wrap{display:block}
.adv-toggle{display:flex;align-items:center;gap:8px;width:100%;padding:9px 0 7px;color:var(--accent-3);
  font-size:12.5px;font-weight:600}
.adv-toggle .arw{display:inline-block;transition:transform var(--dur-fast) var(--ease);font-size:11px}
.sgroup.open .adv-toggle .arw{transform:rotate(90deg)}
.adv-note{font-size:11.5px;color:var(--muted);padding:2px 0 8px}
@media (hover:hover) and (pointer:fine){ .adv-toggle:hover{color:var(--accent-2)} }
.rule-edit{border:1px dashed var(--line-2);border-radius:var(--r);background:var(--bg-soft);padding:10px 11px;margin:7px 0}
.rule-edit .txt{width:100%}

/* ================= 引导 / 向导（P1-5）================= */
.tour-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tour-step{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--bg-elev);padding:11px 12px;
  cursor:pointer;min-width:0;transition:border-color var(--dur-quick) var(--ease),transform var(--dur-quick) var(--ease)}
.tour-step[aria-current="step"]{border-color:var(--accent-2);background:var(--accent-soft)}
.tour-step .n{font-family:var(--font-mono);font-size:10.5px;color:var(--accent-3)}
.tour-step .t{font-size:12.8px;font-weight:600;margin-top:3px}
.tour-step .d{font-size:11.5px;color:var(--muted);margin-top:3px}
@media (hover:hover) and (pointer:fine){ .tour-step:hover{border-color:var(--line-3);transform:translateY(-1px)} }
.tour-art{display:grid;place-items:center;height:132px;border-radius:var(--r);border:1px solid var(--line);
  background:radial-gradient(120% 100% at 30% 10%,var(--accent-soft),transparent 70%),var(--bg-code)}
.tour-art .glyph{font-family:var(--font-mono);font-size:44px;color:var(--accent-3);opacity:.9}
.tour-tier{border:1px solid var(--line);border-radius:var(--r);margin-top:7px;overflow:hidden}
.tour-tier > summary{padding:8px 11px;font-size:12.3px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.tour-tier > summary::-webkit-details-marker{display:none}
.tour-tier > summary::before{content:"▸";color:var(--accent-3);font-size:11px}
.tour-tier[open] > summary::before{content:"▾"}
.tour-tier .bd{padding:2px 11px 10px;font-size:12px;color:var(--fg-dim)}

/* ================= 检索命中 / 结论层标记 ================= */
.hit{border:1px solid var(--line);border-radius:var(--r);background:var(--bg-elev);padding:11px 13px;
  cursor:pointer;min-width:0;transition:border-color var(--dur-quick) var(--ease)}
@media (hover:hover) and (pointer:fine){ .hit:hover{border-color:var(--accent-2)} }
.hit .ht{font-size:13px;font-weight:600}
.hit .hm{font-size:11.5px;color:var(--muted);margin-top:4px}
.hit[data-mark="retracted"]{border-left:3px solid var(--err)}
.hit[data-mark="superseded"]{border-left:3px solid var(--warn)}
.hit mark{background:var(--accent-soft);color:var(--accent-3);border-radius:3px;padding:0 2px}
.searchbar{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--line-2);
  border-radius:var(--r-lg);background:var(--bg-elev);transition:border-color var(--dur-quick) var(--ease)}
.searchbar:focus-within{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbar input{flex:1;border:0;background:none;outline:0;font-size:14.5px;min-width:0}
.searchbar input::placeholder{color:var(--muted)}

/* ================= 原语 2：右侧抽屉（全局唯一）================= */
.scrim{position:fixed;inset:0;background:rgba(4,6,12,.55);z-index:40;opacity:0;
  transition:opacity var(--dur-fast) var(--ease)}
.scrim.is-in{opacity:1}
html[data-theme="light"] .scrim{background:rgba(15,23,42,.34)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(486px,94vw);z-index:50;display:flex;flex-direction:column;
  background:var(--bg-elev);border-left:1px solid var(--line-2);box-shadow:var(--shadow);
  transform:translateX(100%);transition:transform var(--dur-fast) var(--ease)}
.drawer.is-in{transform:none}
.drawer-head{display:flex;align-items:flex-start;gap:12px;padding:15px 15px 12px;border-bottom:1px solid var(--line)}
.drawer-head .ttl{font-size:16px;overflow-wrap:anywhere}
.drawer-body{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:13px;min-width:0}
.drawer-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:11px 15px;border-top:1px solid var(--line)}
.drawer-foot:empty{display:none}

/* ================= 原语 3：居中模态（全局唯一）================= */
.modal-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px}
.scrim-inline{position:absolute;inset:0;background:rgba(4,6,12,.55)}
html[data-theme="light"] .scrim-inline{background:rgba(15,23,42,.34)}
.modal{position:relative;width:min(478px,94vw);background:var(--bg-elev);border:1px solid var(--line-2);
  border-radius:var(--r-lg);padding:19px;box-shadow:var(--shadow);transform:scale(.965);opacity:0;
  transition:transform var(--dur-fast) var(--ease),opacity var(--dur-fast) var(--ease)}
.modal-wrap.is-in .modal{transform:none;opacity:1}
.modal h2{font-size:16px;margin-bottom:6px}
.modal .mbody{font-size:13px;color:var(--fg-dim)}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:17px}
.modal-foot .grow{flex:1}

/* ================= toast（轻提示）================= */
.toast-wrap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--bg-elev);border:1px solid var(--line-2);border-radius:999px;padding:8px 15px;
  font-size:12.5px;box-shadow:var(--shadow);color:var(--fg-dim);max-width:min(560px,92vw);text-align:center}
.toast.ok{border-color:var(--ok)}
.toast.warn{border-color:var(--warn)}
.toast.err{border-color:var(--err)}

/* ================= 响应式 ================= */
@media (max-width:1420px){
  .kanban{grid-template-columns:repeat(3,minmax(190px,1fr))}
}
@media (max-width:1240px){
  .app{grid-template-columns:214px minmax(0,1fr)}
  .cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow-grid,.cols-3,.settings-grid,.four,.split{grid-template-columns:minmax(0,1fr)}
  .kanban{grid-template-columns:repeat(2,minmax(190px,1fr))}
  .tour-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sum-row{grid-template-columns:repeat(3,minmax(0,1fr))}
  .legend{display:none}
  .menu-btn{display:inline-flex !important}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:246px;z-index:30;transform:translateX(-100%);
    transition:transform var(--dur-fast) var(--ease);box-shadow:var(--shadow)}
  .sidebar.is-open{transform:none}
  .cols-2,.cols-4,.kanban,.hub-lib,.tour-steps{grid-template-columns:minmax(0,1fr)}
  .sum-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal-cell{min-height:64px}
}
.menu-btn{display:none !important;align-items:center;gap:6px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
  .screen.is-active{animation:none}
  .kcard:hover,.tour-step:hover{transform:none}
}

  function donut(parts, size) {
    var r = 42, cx = 60, cy = 60, circ = 2 * Math.PI * r, acc = 0, out = '';
    var total = parts.reduce(function (a, b) { return a + b[1]; }, 0) || 1;
    parts.forEach(function (p, i) {
      var frac = p[1] / total, len = frac * circ;
      out += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(' + p[2] + ')"' +
        ' stroke-width="14" stroke-dasharray="' + len.toFixed(2) + ' ' + (circ - len).toFixed(2) + '"' +
        ' stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"' +
        ' opacity="' + (0.55 + (i % 3) * 0.15) + '"></circle>';
      acc += len;
    });
    return '<svg viewBox="0 0 120 120" width="' + (size || 120) + '" height="' + (size || 120) + '" role="img" aria-label="召回来源构成">' +
      out + '<circle cx="60" cy="60" r="30" fill="var(--bg-elev)"></circle>' +
      '<text x="60" y="57" text-anchor="middle" fill="var(--fg)" font-size="15" font-family="ui-monospace,monospace">' + total + '</text>' +
      '<text x="60" y="72" text-anchor="middle" fill="var(--muted)" font-size="8">事件总数</text></svg>';
  }
  function bars(list, max) {
    var m = max || Math.max.apply(null, list.map(function (x) { return x[1]; }));
    return '<div class="stack" style="gap:7px">' + list.map(function (x) {
      return '<div><div class="spread" style="margin-bottom:3px">' +
        '<span style="font-size:12.3px">' + esc(x[0]) + '</span>' +
        '<span class="mono tiny mute">' + x[1] + '</span></div>' +
        '<div class="meter"><i style="width:' + Math.max(3, Math.round(x[1] / m * 100)) + '%"></i></div></div>';
    }).join('') + '</div>';
  }
  function spark(vals) {
    var w = 220, hgt = 46, max = Math.max.apply(null, vals), pts = vals.map(function (v, i) {
      return (i / (vals.length - 1) * w).toFixed(1) + ',' + (hgt - v / max * (hgt - 6) - 3).toFixed(1);
    }).join(' ');
    return '<svg viewBox="0 0 ' + w + ' ' + hgt + '" width="100%" height="' + hgt + '" role="img" aria-label="按天走势">' +
      '<polyline points="' + pts + '" fill="none" stroke="var(--accent-2)" stroke-width="2"></polyline></svg>';
  }

      b.setAttribute('aria-selected', b.getAttribute('data-l2') === state.screen ? 'true' : 'false');
    });
    var c = NAV[state.l1], t = (SCREENS[state.screen] || {}).title;
    $('#crumb').innerHTML = '<span>' + c.label + '</span>' +
      (state.screen === NAV[state.l1].tabs[0][0] ? '' : '<span class="sep">/</span><span>' + esc(t || '') + '</span>') +
      (c.planned ? ' <span class="badge planned">规划中</span>' : '');

  function show(key) {
    var def = SCREENS[key];
    if (!def) return;
    var host = $('#screens');
    var el = $('#screen-' + key);
    if (!el) {
      el = document.createElement('section');
      el.className = 'screen';
      el.id = 'screen-' + key;
      el.setAttribute('data-screen', key);
      var html = '';
      try { html = def.fn(); } catch (e) {
        html = head(def.title, '这一屏渲染失败了。') +
          callout('渲染错误：' + esc(String(e && e.message || e)), 'err', '✕');
      }
      el.innerHTML = html;
      host.appendChild(el);
    }
    $$('.screen').forEach(function (x) { x.classList.remove('is-active'); });
    el.classList.add('is-active');
    var l1Changed = state.l1 !== def.l1;
    state.screen = key;
    state.l1 = def.l1;
    host.scrollTop = 0;
    /* 只在 L1 变化时重建二级页签：每次都重建会白白丢掉页签条的横向滚动位置 */

    afterRender(key);
  }

    if (key === 'water') startCountdown();
    if (key === 'calendar') { /* 静态假数据，无需初始化 */ }
    if (key === 'workspaces') initGraph();
    if (key === 'search') runSearch();
    if (key === 'about') setTourStep(0);
  }

  function runSearch() {
    var q = $('#q');
    if (!q) return;
    var kw = (q.value || '').trim();
    var n = 0;
    $$('#hit-list .hit').forEach(function (h) {
      var ok = !kw || h.textContent.indexOf(kw) > -1;
      h.style.display = ok ? '' : 'none';
      if (ok) n++;
    });
    var st = $('#stat-hits');
    if (st) st.textContent = String(n);
  }

  function initGraph() {
    var cv = $('#graph-canvas'), layer = $('#graph-layer'), zoom = $('#graph-zoom');
    if (!cv || !layer) return;
    var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0, scale = 1;
    function paint() {
      layer.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + scale + ')';
      layer.style.transformOrigin = '50% 50%';
      var zv = $('#zoom-val');
      if (zv) zv.textContent = Math.round(scale * 100) + '%';
      if (zoom) zoom.value = Math.round(scale * 100);
    }
    if (!cv.getAttribute('data-bound')) {
      cv.setAttribute('data-bound', '1');
      cv.addEventListener('pointerdown', function (e) {
        dragging = true; sx = e.clientX - ox; sy = e.clientY - oy;
        cv.classList.add('dragging');
        if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
      });
      cv.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        ox = e.clientX - sx; oy = e.clientY - sy; paint();
      });
      cv.addEventListener('pointerup', function () { dragging = false; cv.classList.remove('dragging'); });
      cv.addEventListener('pointercancel', function () { dragging = false; cv.classList.remove('dragging'); });
      if (zoom) zoom.addEventListener('input', function () { scale = Number(zoom.value) / 100; paint(); });
      var reset = $('#zoom-reset');
      if (reset) reset.addEventListener('click', function () {
        scale = 1; ox = 0; oy = 0; paint(); toast('关系图已重置', '');
      });
    }
    paint();
  }

  var tourIdx = 0;
  function setTourStep(i) {
    tourIdx = Math.max(0, Math.min(TOUR_STEPS.length - 1, i));
    $$('[data-tour-step]').forEach(function (el) {
      if (Number(el.getAttribute('data-tour-step')) === tourIdx) el.setAttribute('aria-current', 'step');
      else el.removeAttribute('aria-current');
    });
    var t = $('#tour-title'), b = $('#tour-body'), n = $('#tour-note');
    if (t) t.textContent = TOUR_STEPS[tourIdx][0];
    if (b) b.textContent = TOUR_STEPS[tourIdx][2];
    if (n) n.textContent = '第 ' + (tourIdx + 1) + ' / ' + TOUR_STEPS.length + ' 步';
  }

  function bindAll() {
    /* 一级导航 */
    $$('.nav-item[data-l1]').forEach(function (b) {
      b.addEventListener('click', function () { gotoL1(b.getAttribute('data-l1')); });
    });
    /* 二级页签 */
    $('#l2').addEventListener('click', function (e) {
      var t = e.target.closest('.l2-tab');
      if (t) show(t.getAttribute('data-l2'));
    });
    /* 菜单按钮（窄屏） */
    var mb = $('#menu-btn');
    if (mb) mb.addEventListener('click', function () { $('.sidebar').classList.toggle('is-open'); });
    /* 主题 */
    $('#theme-toggle').addEventListener('click', function () {
      setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
    /* 搜索（纯本地假数据，无网络请求） */
    document.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'q') runSearch();
    });
    document.addEventListener('click', function (e) {
      if (e.target.closest('#q-go')) { runSearch(); return; }
      if (e.target.closest('#q-clear')) {
        var q = $('#q');
        if (q) { q.value = ''; runSearch(); q.focus(); }
        return;
      }
    });

    document.addEventListener('click', function (e) {
      var g = e.target.closest('[data-go]');
      if (g) { go(g.getAttribute('data-go')); return; }
      var o = e.target.closest('[data-open-drawer]');
      if (o) { openDrawer(o.getAttribute('data-open-drawer'), o); return; }
      if (e.target.closest('[data-close-drawer]')) { closeDrawer(); return; }
      if (e.target === scrim) { closeDrawer(); return; }
      var m = e.target.closest('[data-open-modal]');
      if (m) { openModal(m.getAttribute('data-open-modal')); return; }
      if (e.target.closest('[data-close-modal]')) { closeModal(); return; }

      /* 开关：点击后标签立刻翻面（用户硬性偏好） */
      var sw = e.target.closest('.sw');
      if (sw) {
        var on = sw.getAttribute('aria-checked') === 'true';
        sw.setAttribute('aria-checked', on ? 'false' : 'true');
        var key = sw.getAttribute('data-sw');
        var lbl = $('.js-sw-state[data-for="' + key + '"]');
        if (lbl) lbl.textContent = on ? '已关闭' : '已启用';
        return;
      }
      /* 单选组 */
      var rb = e.target.closest('[data-radio] button');
      if (rb) {
        var grp = rb.closest('[data-radio]');
        $$('button', grp).forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
        rb.setAttribute('aria-pressed', 'true');
        if (grp.getAttribute('data-radio') === 'theme') setTheme(rb.getAttribute('data-val'));
        if (grp.getAttribute('data-radio') === 'boardmode' && rb.getAttribute('data-val') === 'graph') {
          toast('画布视图默认隐藏，需要在本地打开开关才会出现（演示稿不切换）', 'warn');
        }
        return;
      }
      /* chip 组 */
      var chip = e.target.closest('.chip[aria-pressed]');
      if (chip) {
        var sib = chip.parentElement.querySelectorAll('.chip[aria-pressed]');
        Array.prototype.forEach.call(sib, function (c) { c.setAttribute('aria-pressed', 'false'); });
        chip.setAttribute('aria-pressed', 'true');
        if (chip.hasAttribute('data-board-zoom')) {
          $('#kanban').classList.toggle('zoom1', chip.getAttribute('data-board-zoom') === 'compact');
        }
        if (chip.hasAttribute('data-conflict')) {
          toast('冲突策略：' + chip.textContent.trim(), '');
        }
        if (chip.hasAttribute('data-search-mode')) {
          toast(chip.getAttribute('data-search-mode') === 'smart'
            ? '已切到智能检索：它会先分析再给答案（演示稿保留同一份假数据）'
            : '已切到词法检索', '');
        }
        return;
      }
      /* 引导步骤 */
      var ts = e.target.closest('[data-tour-step]');
      if (ts) { setTourStep(Number(ts.getAttribute('data-tour-step'))); return; }
      if (e.target.closest('#tour-prev')) { setTourStep(tourIdx - 1); return; }
      if (e.target.closest('#tour-next')) {
        if (tourIdx >= TOUR_STEPS.length - 1) toast('引导结束。随时可在「设置 · 关于与诊断」重新打开', 'ok');
        else setTourStep(tourIdx + 1);
        return;
      }
      /* 五档裁定（P0-1） */
      var ape = e.target.closest('[data-ape]');
      if (ape) {
        var oid = ape.getAttribute('data-ape'), ch = ape.getAttribute('data-choice');
        var box = document.getElementById(oid);
        if (box) {
          box.setAttribute('data-sent', '1');
          $$('[data-ape="' + oid + '"]').forEach(function (b) {
            b.setAttribute('aria-pressed', b.getAttribute('data-choice') === ch ? 'true' : 'false');
          });
          var name = '';
          CHOICES.forEach(function (c) { if (c.key === ch) name = c.name; });
          var echo = $('[data-choice-echo="' + oid + '"]', box);
          if (echo) {
            echo.innerHTML = '你的裁定：<b style="color:var(--fg)">' + esc(ch + ' · ' + name) + '</b> ' +
              '<span class="mute">（已写入判定队列 · 进的是本机全局队列，不按项目隔离；可再次点击覆盖）</span>';
          }
        }
        toast('已记录裁定 ' + ch + '（只写队列，不改策略）', 'ok');
        return;
      }
      /* 知识中枢动作 */
      var hub = e.target.closest('[data-hub]');
      if (hub) {
        var act = hub.getAttribute('data-hub'), hid = hub.getAttribute('data-id') || '';
        var msg = $('[data-hub-msg="' + hid + '"]');
        if (act === 'transfer-demo') { runTransfer(); return; }
        if (act === 'promote') { applyHub(hid, 'validated', 'active', '已晋升：已验证 → 已激活'); }
        else if (act === 'approve') { applyHub(hid, 'candidate', 'validated', '已人工批准：待批准 → 已验证'); }
        else if (act === 'force') { applyHub(hid, 'candidate', 'validated', '已强制晋升（记录一次人工覆盖）'); }
        else if (act === 'activate') { applyHub(hid, null, 'active', '已直接激活'); }
        else if (act === 'pin') { toast('置顶状态已切换', ''); }
        else if (act === 'deprecate') { applyHub(hid, null, 'deprecated', '已弃用（软状态：条目仍在，不再注入）'); }
        else if (act === 'transfer') { toast('打开归属转移：' + hid + '（两阶段提交 · 失败会显示回滚）', ''); }
        if (msg) msg.textContent = '';
        return;
      }
      /* 外部记忆接入（P0-4） */
      var ev = e.target.closest('[data-ext-view]');
      if (ev) {
        var k = ev.getAttribute('data-ext-view');
        var body = $('[data-ext-body="' + k + '"]');
        if (body) body.hidden = !body.hidden;
        return;
      }
      var ef = e.target.closest('[data-ext-find]');
      if (ef) {
        var k2 = ef.getAttribute('data-ext-find');
        var fm = $('[data-ext-findmsg="' + k2 + '"]');
        if (fm) fm.textContent = '在记忆中反查：命中 3 条（用于确认导入是否真的落地）';
        return;
      }
      var ea = e.target.closest('[data-ext-import]');
      if (ea) {
        if (ea.getAttribute('data-done') === '1') { toast('该来源已接入此目标，无需重复导入', ''); return; }
        if (ea.getAttribute('data-armed') === '1') {
          ea.setAttribute('data-done', '1');
          ea.removeAttribute('data-armed');
          ea.textContent = ea.textContent.replace(/确认接入？$/, '') + ' ✓';
          toast('已接入（纯链接模式：只登记指针，不复制内容）', 'ok');
        } else {
          ea.setAttribute('data-armed', '1');
          ea.textContent = '确认接入？';
          toast('两阶段确认：再点一次才会真的提交', 'warn');
        }
        return;
      }
      var er = e.target.closest('[data-ext-remove]');
      if (er) {
        if (er.getAttribute('data-armed') === '1') {
          er.removeAttribute('data-armed');
          er.removeAttribute('data-done');
          er.textContent = '撤出已接入内容';
          toast('已撤出本插件接入的段落；来源文件未被触碰', 'ok');
        } else {
          er.setAttribute('data-armed', '1');
          er.textContent = '确认删除？';
          toast('两阶段确认：第一次点击只武装，第二次才提交', 'warn');
        }
        return;
      }
      /* 规则 / 笔记 */
      if (e.target.closest('#rule-add')) {
        var rn = $('#rule-new'), rm = $('#rule-msg');
        if (rn && rn.value.trim()) { if (rm) rm.textContent = '已新增：下一轮起每轮无条件注入'; rn.value = ''; }
        else if (rm) rm.textContent = '草稿为空，没有提交任何内容';
        return;
      }
      var rs = e.target.closest('[data-rule-save]');
      if (rs) { toast('已保存该条规则；下一轮注入会更新', 'ok'); return; }
      var rc = e.target.closest('[data-rule-cancel]');
      if (rc) { toast('已取消编辑', ''); return; }
      if (e.target.closest('#note-add')) {
        var nd = $('#note-draft'), nm = $('#note-msg');
        if (nd && nd.value.trim()) { if (nm) nm.textContent = '已追加到项目笔记'; nd.value = ''; }
        else if (nm) nm.textContent = '草稿为空，未写入任何内容（这是有意的）';
        return;
      }
      /* 接续 / 反思 */
      if (e.target.closest('#btn-continue') || e.target.closest('#cont-now')) {
        var cm = $('#cont-msg2') || $('#cont-msg');
        if (cm) cm.textContent = '接续流程已启动：刷新白板与账本 → 建立新会话（演示）。';
        toast('已开始接续（演示）', 'ok');
        return;
      }
      if (e.target.closest('#cont-later')) {
        var cl = $('#cont-msg');
        if (cl) cl.textContent = '已延后。30–40 秒无操作按挂机处理，宿主会自己完成接续。';
        return;
      }
      if (e.target.closest('#cont-off')) {
        toast('已关闭自动接续；骨架账本不受影响（两个开关互相独立）', 'warn');
        return;
      }
      if (e.target.closest('#btn-reflect') || e.target.closest('#btn-reflect2')) {
        var rf = $('#reflect-msg');
        if (rf) rf.textContent = '反思已生成并落盘（演示）。';
        toast('反思已生成', 'ok');
        return;
      }
      if (e.target.closest('#btn-new-handoff')) { openModal('m-new-handoff'); return; }
      /* 统计 / 扫描 / 探针 */
      if (e.target.closest('#stats-reset')) { toast('统计已清零，正在重新累计', 'ok'); return; }
      if (e.target.closest('#scan-btn')) { toast('重新扫描完成：42 个来源，1 处摘要不一致', ''); return; }
      if (e.target.closest('#heal-btn')) { toast('已重建 1 个摘要文件；正文未改动一个字节', 'ok'); return; }
      if (e.target.closest('#probe-btn')) {
        var pm = $('#probe-msg');
        if (pm) pm.textContent = '探针完成：11 个接口全部 200，最慢 301 ms。';
        return;
      }
      if (e.target.closest('#update-check')) {
        var um = $('#update-msg');
        if (um) um.textContent = '当前已是最新版本。';
        return;
      }
      if (e.target.closest('#ws-refresh')) { toast('已重新扫描工作区（演示数据未变）', ''); return; }
      if (e.target.closest('#ext-rescan')) { toast('重新扫描完成：4 个可接入源 + 1 个会话索引', ''); return; }
      if (e.target.closest('#ext-all')) { toast('全部接入按顺序串行执行；会话索引类会被跳过', 'ok'); return; }
      if (e.target.closest('#ext-exclude-save')) {
        var em = $('#ext-exclude-msg');
        if (em) em.textContent = '已保存：命中的来源不参与注入';
        return;
      }
      /* 日历 */
      if (e.target.closest('#cal-prev') || e.target.closest('#cal-next')) {
        toast('演示稿只内置了 2026 年 9 月的数据；真实实现里可跨月翻页', 'warn');
        return;
      }
      var cd = e.target.closest('[data-open-cal]');
      if (cd) {
        var iso = cd.getAttribute('data-open-cal');
        var list = CALEVENTS(iso);
        toast(iso + '：' + (list.length ? list.length + ' 项日程（时间轴见 09-23 示例）' : '没有日程'), '');
        return;
      }
      if (e.target.closest('#arm-demo')) {
        var btn = $('#arm-demo'), am = $('#arm-msg');
        if (btn.getAttribute('data-armed') === '1') {
          btn.removeAttribute('data-armed'); btn.textContent = '撤出已接入内容';
          if (am) am.textContent = '已提交撤出（演示）';
        } else {
          btn.setAttribute('data-armed', '1'); btn.textContent = '确认删除？';
          if (am) am.textContent = '已武装：再点一次才真的提交';
        }
        return;
      }
    });

    $('#modal-ok').addEventListener('click', function () {
      if (modalOk) modalOk();
      closeModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (!modal.hidden) closeModal();
      else if (!drawer.hidden) closeDrawer();
    });
  }

  /* 知识中枢状态迁移（本地演示） */
  function applyHub(id, fromStage, toStage, msg) {
    var box = document.getElementById('appr-' + id);
    if (box) {
      box.setAttribute('data-stage', toStage);
      var badges = $$('.badge', box);
      var zh = { observed: '观察', candidate: '候选', validated: '已验证', active: '已激活', deprecated: '已弃用' };
      badges.forEach(function (b) {
        if (/^(观察|候选|已验证|已激活|已弃用)$/.test(b.textContent.trim())) {
          b.textContent = zh[toStage];
          b.className = 'badge ' + (toStage === 'active' ? 'ok' : toStage === 'deprecated' ? 'muted' : 'info');
        }
      });
    }
    toast(msg, toStage === 'deprecated' ? 'warn' : 'ok');
  }
  /* 归属转移：两阶段提交 + 回滚可见（P0-5） */
  function runTransfer() {
    var box = $('#transfer-box');
    if (!box) return;
    box.innerHTML = '<div class="rollback pending" data-transfer="pending">' +
      '<div class="sec" style="margin-bottom:6px">阶段 1 · 写入临时目录并校验</div>' +
      '<div class="dim" style="font-size:12.5px">正在写入 3 个文件并计算校验和……</div>' +
      '<div class="code" style="margin-top:9px">21:41:02  begin  transfer-scope  proc_a41  workspace → global\n' +
      '21:41:02  stage1  write  temp/  3 files</div></div>';
    window.setTimeout(function () {
      box.innerHTML = '<div class="rollback" data-transfer="rolledBack">' +
        '<div class="sec" style="margin-bottom:6px">阶段 1 失败 → 已完整回滚</div>' +
        '<div class="kvlist">' +
        kv('结果', TRANSFER.result + '（' + TRANSFER.resultZh + '）') +
        kv('原因码', TRANSFER.reason + ' · ' + TRANSFER.reasonZh) +
        '</div>' +
        '<div class="tiny mute" style="margin-top:7px">' + TRANSFER.detail + '</div>' +
        '<div class="code" style="margin-top:9px">' + TRANSFER.audit.map(esc).join('\n') + '</div></div>';
      toast('转移失败并已回滚 —— 回滚结果必须让人看见，不能静默成完成', 'err');
    }, 1200);
  }

  /* ============================================================
     §26 初始化
     ============================================================ */
  function init() {
    $('#app').innerHTML = shellHtml();
    bindAll();
    buildL2(state.l1);
    setTheme('dark');
    show(HOME);
  }
  init();

  return {
    NAV: NAV, SCREENS: SCREENS, LANES: LANES, LIBS: LIBS, CARRIERS: CARRIERS,
    CHOICES: CHOICES, WATER: WATER, HONESTY: HONESTY_ROWS,
    show: show, go: go, toast: toast, state: state
  };
})();
</script>
