<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" preserveAspectRatio="xMidYMid meet" role="img" style="font-variant-numeric:tabular-nums" font-family="Manrope,'Space Grotesk','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<title>相邻请求间隔与缓存命中率,四个间隔分组的双通道对照</title>
<rect width="880" height="460" fill="#ffffff"/>
<!--region canvas 0 0 880 460-->
<!--region p 52 84 776 320-->
<text x="52" y="32" font-size="12.5" fill="#454545">若为 TTL 所致,间隔越短命中应越高。实测 0–10 秒内仍有 15.2% 未命中。</text>
<rect x="52" y="44" width="22" height="13" fill="#2563eb"/><text x="83" y="54" font-size="12.5" font-weight="700" fill="#1e232c">DeepSeek V4.1 Flash</text><rect x="233" y="44" width="22" height="13" fill="#cbd5e1"/><text x="264" y="54" font-size="12.5" font-weight="700" fill="#1e232c">GLM 5.3 Flash(同站同时段对照)</text>
<text x="52" y="440" font-size="13.5" font-weight="700" fill="#c0504d">任何 TTL 都无法解释 5–20 秒内的缓存失效</text>
