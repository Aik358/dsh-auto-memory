<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" preserveAspectRatio="xMidYMid meet" role="img" style="font-variant-numeric:tabular-nums" font-family="Manrope,'Space Grotesk','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<title>提示词从 1149 字符压缩到 45 字符，合规率保持 100% 不变；实测 token 也从 2651 到 2774，变化落在采样噪声内</title>
<rect width="880" height="480" fill="#ffffff"/>
<!--region canvas 0 0 880 480-->
<!--region p 56 84 750 340-->
<text x="56" y="32" font-size="17.5" font-weight="700" fill="#1e232c">删掉 96% 的提示词，合规率不动、token 也不动</text>
<text x="56" y="54" font-size="12.5" fill="#454545">交接账本 8 个版本 × 5 任务 = 40 次；token 为同口径 3 次均值</text>
<rect x="56" y="66" width="22" height="13" fill="#2563eb"/><text x="87" y="76" font-size="12.5" font-weight="700" fill="#1e232c">合规率（左轴）</text><rect x="200.5" y="66" width="22" height="13" fill="#94a3b8"/><text x="231.5" y="76" font-size="12.5" font-weight="700" fill="#1e232c">inputTokens（右轴，仅三点实测）</text>
<text x="56" y="442" font-size="13.5" font-weight="700" fill="#2563eb">合规率恒为 100%：删提示词没有代价，也没有收益</text>
<text x="56" y="460" font-size="13.5" font-weight="700" fill="#c0504d">token 2,651→2,774：同配置三次就分布在 2,439–2,958，变化淹没在噪声里</text>
