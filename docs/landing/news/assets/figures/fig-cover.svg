<text x="44" y="32" font-size="17.5" font-weight="700" fill="#1e232c">双层语料基准</text>
<text x="44" y="54" font-size="12.5" fill="#454545">同一套实验,两层语料给出相反的结论</text>
<rect x="44" y="66" width="22" height="13" fill="#60a5fa"/><text x="75" y="76" font-size="12.5" font-weight="700" fill="#1e232c">L1 合成压力层</text><rect x="182.5" y="66" width="22" height="13" fill="#2563eb"/><text x="213.5" y="76" font-size="12.5" font-weight="700" fill="#1e232c">L2 真实语料层</text>
<text x="44" y="380" font-size="13.5" font-weight="700" fill="#c0504d">在合成语料上得到的调参结论,换一层语料就可能完全相反</text>
<text x="44" y="99" font-size="15" font-weight="700" fill="#1e232c">L1 合成压力层</text>
<text x="44" y="117" font-size="12" fill="#454545">偏好小窗 → 256 最优</text>
